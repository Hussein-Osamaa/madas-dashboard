<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - MADAS Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="assets/img/madas-logo.png">
    <style>
        :root {
            --madas-primary: #27491F;
            --madas-dark: #F0CAE1;
            --madas-light: #F4F4F4;
            --madas-accent: #FFD300;
            --bg-main: #F4F4F4;
            --text-main: #1F2937;
            --text-secondary: #6B7280;
            --card-bg: #FFFFFF;
            --card-border: #E5E7EB;
            --sidebar-bg: #FFFFFF;
            --header-bg: #FFFFFF;
        }

        body {
            font-family: 'Inter', sans-serif;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .gradient-bg {
            background: linear-gradient(135deg, var(--madas-primary), #1f3c19);
        }

        .card-hover {
            transition: all 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .input-focus {
            transition: all 0.3s ease;
        }

        .input-focus:focus {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(39, 73, 31, 0.15);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--madas-primary), #1f3c19);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(39, 73, 31, 0.3);
        }

        .loading-spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .password-strength {
            transition: all 0.3s ease;
        }

        .strength-weak {
            background: linear-gradient(90deg, #ef4444 0%, #ef4444 25%, #e5e7eb 25%, #e5e7eb 100%);
        }

        .strength-fair {
            background: linear-gradient(90deg, #f59e0b 0%, #f59e0b 50%, #e5e7eb 50%, #e5e7eb 100%);
        }

        .strength-good {
            background: linear-gradient(90deg, #10b981 0%, #10b981 75%, #e5e7eb 75%, #e5e7eb 100%);
        }

        .strength-strong {
            background: linear-gradient(90deg, #059669 0%, #059669 100%);
        }

        /* Input fields and form elements */
        input[type="text"],
        input[type="number"],
        input[type="email"],
        input[type="password"],
        textarea,
        select {
            background-color: var(--card-bg) !important;
            color: var(--text-main) !important;
            border-color: var(--card-border) !important;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        textarea:focus,
        select:focus {
            border-color: var(--madas-accent) !important;
            box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.2) !important;
        }

        input[type="text"]::placeholder,
        input[type="number"]::placeholder,
        input[type="email"]::placeholder,
        input[type="password"]::placeholder,
        textarea::placeholder {
            color: var(--text-secondary) !important;
        }

        /* Search bar specific styling */
        input[type="search"] {
            background-color: var(--card-bg) !important;
            color: var(--text-main) !important;
            border-color: var(--card-border) !important;
        }

        input[type="search"]:focus {
            border-color: var(--madas-accent) !important;
            box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.2) !important;
        }

        input[type="search"]::placeholder {
            color: var(--text-secondary) !important;
        }

        /* Select dropdowns */
        select {
            background-color: var(--card-bg) !important;
            color: var(--text-main) !important;
            border-color: var(--card-border) !important;
        }

        select:focus {
            border-color: var(--madas-accent) !important;
            box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.2) !important;
        }

        /* Modal styling */
        .modal,
        .modal .bg-white,
        .glass-effect {
            background-color: var(--card-bg) !important;
        }

        /* Form labels */
        label {
            color: var(--text-main) !important;
        }

        /* Readonly inputs */
        input[readonly] {
            background-color: var(--bg-main) !important;
            color: var(--text-secondary) !important;
        }

        /* Checkbox styling */
        input[type="checkbox"] {
            background-color: var(--card-bg) !important;
            border-color: var(--card-border) !important;
        }

        input[type="checkbox"]:checked {
            background-color: var(--madas-accent) !important;
            border-color: var(--madas-accent) !important;
        }
    </style>
</head>

<body
    class="min-h-screen bg-gradient-to-br from-[var(--madas-light)] via-white to-[var(--madas-dark)] flex items-center justify-center p-4">
    <!-- Background Pattern -->
    <div class="absolute inset-0 overflow-hidden">
        <div class="absolute -top-40 -right-40 w-80 h-80 bg-[var(--madas-accent)] rounded-full opacity-10"></div>
        <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-[var(--madas-primary)] rounded-full opacity-10"></div>
    </div>

    <!-- Main Signup Container -->
    <div class="relative z-10 w-full max-w-md">
        <!-- Logo and Brand -->
        <div class="text-center mb-8">
            <div class="w-8 h-8 bg-[var(--madas-primary)] rounded-lg flex items-center justify-center">
                <img src="assets/img/madas.png" alt="Madas Logo" class="w-full h-full object-cover">
            </div>
            <h1 class="text-3xl font-bold text-[var(--madas-primary)] mb-2">Create Your Business</h1>
            <p class="text-gray-600">Start your own business dashboard with MADAS</p>
        </div>

        <!-- Selected Plan Notice -->
        <div id="planNotice" class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
            <div class="flex items-center">
                <div class="flex-shrink-0">
                    <span class="text-2xl">📋</span>
                </div>
                <div class="ml-3">
                    <h3 class="text-sm font-medium text-blue-800">
                        Selected Plan: <span id="selectedPlanName" class="font-bold">Starter</span>
                    </h3>
                    <p class="text-sm text-blue-700 mt-1">
                        15 days free trial • No credit card required • <a href="../simple-website/plans.html"
                            class="underline hover:text-blue-900">Change plan</a>
                    </p>
                </div>
            </div>
        </div>

        <!-- Signup Form -->
        <div class="glass-effect card-hover rounded-2xl p-8 shadow-xl">
            <form id="signupForm" class="space-y-6">
                <!-- Full Name Input -->
                <div>
                    <label for="fullName" class="block text-sm font-semibold text-[var(--madas-primary)] mb-2">
                        Full Name
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="material-icons text-gray-400">person</span>
                        </span>
                        <input type="text" id="fullName" required placeholder="Enter your full name"
                            class="input-focus w-full pl-10 pr-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[var(--madas-primary)] focus:ring-4 focus:ring-[var(--madas-primary)] focus:ring-opacity-10" />
                    </div>
                </div>

                <!-- Email Input -->
                <div>
                    <label for="email" class="block text-sm font-semibold text-[var(--madas-primary)] mb-2">
                        Email Address
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="material-icons text-gray-400">email</span>
                        </span>
                        <input type="email" id="email" required placeholder="you@example.com"
                            class="input-focus w-full pl-10 pr-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[var(--madas-primary)] focus:ring-4 focus:ring-[var(--madas-primary)] focus:ring-opacity-10" />
                    </div>
                </div>

                <!-- Contact Input -->
                <div>
                    <label for="contact" class="block text-sm font-semibold text-[var(--madas-primary)] mb-2">
                        Phone or Instagram
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="material-icons text-gray-400">phone</span>
                        </span>
                        <input type="text" id="contact" required placeholder="+9715XXXXXXX or @yourhandle"
                            class="input-focus w-full pl-10 pr-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[var(--madas-primary)] focus:ring-4 focus:ring-[var(--madas-primary)] focus:ring-opacity-10" />
                    </div>
                </div>

                <!-- Password Input -->
                <div>
                    <label for="password" class="block text-sm font-semibold text-[var(--madas-primary)] mb-2">
                        Password
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="material-icons text-gray-400">lock</span>
                        </span>
                        <input type="password" id="password" required placeholder="Create a strong password"
                            class="input-focus w-full pl-10 pr-12 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[var(--madas-primary)] focus:ring-4 focus:ring-[var(--madas-primary)] focus:ring-opacity-10" />
                        <button type="button" id="togglePassword"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-[var(--madas-primary)] transition-colors">
                            <span class="material-icons" id="eyeIcon">visibility</span>
                            <span class="material-icons hidden" id="eyeSlashIcon">visibility_off</span>
                        </button>
                    </div>

                    <!-- Password Strength Indicator -->
                    <div class="mt-2">
                        <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
                            <div id="passwordStrength" class="h-full password-strength transition-all duration-300">
                            </div>
                        </div>
                        <p id="passwordStrengthText" class="text-xs mt-1 text-gray-500">Password strength</p>
                    </div>
                </div>

                <!-- Confirm Password Input -->
                <div>
                    <label for="confirmPassword" class="block text-sm font-semibold text-[var(--madas-primary)] mb-2">
                        Confirm Password
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="material-icons text-gray-400">lock</span>
                        </span>
                        <input type="password" id="confirmPassword" required placeholder="Confirm your password"
                            class="input-focus w-full pl-10 pr-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[var(--madas-primary)] focus:ring-4 focus:ring-[var(--madas-primary)] focus:ring-opacity-10" />
                    </div>
                </div>

                <!-- Terms and Conditions -->
                <div class="flex items-start space-x-3">
                    <input type="checkbox" id="agreeTerms" required
                        class="w-4 h-4 text-[var(--madas-primary)] bg-gray-100 border-gray-300 rounded focus:ring-[var(--madas-primary)] focus:ring-2 mt-1">
                    <label for="agreeTerms" class="text-sm text-gray-700">
                        I agree to the
                        <a href="#" class="text-[var(--madas-primary)] hover:text-[#1f3c19] font-medium">Terms of
                            Service</a>
                        and
                        <a href="#" class="text-[var(--madas-primary)] hover:text-[#1f3c19] font-medium">Privacy
                            Policy</a>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="signupBtn"
                    class="btn-primary w-full text-white py-3 rounded-xl font-semibold text-lg relative overflow-hidden">
                    <span id="signupBtnText">Create Account</span>
                    <span id="signupBtnSpinner"
                        class="loading-spinner hidden absolute inset-0 flex items-center justify-center">
                        <span class="material-icons">refresh</span>
                    </span>
                </button>
            </form>

            <!-- Divider -->
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-300"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-white text-gray-500">Or sign up with</span>
                </div>
            </div>

            <!-- Social Signup Buttons -->
            <div class="grid grid-cols-2 gap-3">
                <button
                    class="flex items-center justify-center px-4 py-2 border border-gray-300 rounded-xl hover:bg-gray-50 transition-colors">
                    <span class="material-icons text-blue-600 mr-2">facebook</span>
                    <span class="text-sm font-medium">Facebook</span>
                </button>
                <button
                    class="flex items-center justify-center px-4 py-2 border border-gray-300 rounded-xl hover:bg-gray-50 transition-colors">
                    <span class="material-icons text-red-600 mr-2">mail</span>
                    <span class="text-sm font-medium">Google</span>
                </button>
            </div>

            <!-- Login Link -->
            <p class="text-center text-sm text-gray-600 mt-6">
                Already have an account?
                <a href="Login.html"
                    class="text-[var(--madas-primary)] hover:text-[#1f3c19] font-semibold transition-colors">
                    Sign in
                </a>
            </p>
        </div>

        <!-- Status Messages -->
        <div id="statusMessage" class="hidden mt-4 p-4 rounded-xl text-center">
            <span id="statusText"></span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { createUserWithEmailAndPassword, updateProfile, getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { setDoc, doc, getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC-ls1TrvSkrw71KqmB_kHYgPoj0H550a8",
            authDomain: "madas-store.firebaseapp.com",
            projectId: "madas-store",
            storageBucket: "madas-store.firebasestorage.app",
            messagingSenderId: "527071300010",
            appId: "1:527071300010:web:70470e2204065b4590583d3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // DOM Elements
        const signupForm = document.getElementById('signupForm');
        const signupBtn = document.getElementById('signupBtn');
        const signupBtnText = document.getElementById('signupBtnText');
        const signupBtnSpinner = document.getElementById('signupBtnSpinner');
        const fullName = document.getElementById('fullName');
        const email = document.getElementById('email');
        const contact = document.getElementById('contact');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        const togglePassword = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeSlashIcon = document.getElementById('eyeSlashIcon');
        const passwordStrength = document.getElementById('passwordStrength');
        const passwordStrengthText = document.getElementById('passwordStrengthText');
        const agreeTerms = document.getElementById('agreeTerms');
        const statusMessage = document.getElementById('statusMessage');
        const statusText = document.getElementById('statusText');

        // Show/Hide Password Toggle
        togglePassword.addEventListener('click', () => {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);

            if (type === 'text') {
                eyeIcon.classList.add('hidden');
                eyeSlashIcon.classList.remove('hidden');
            } else {
                eyeIcon.classList.remove('hidden');
                eyeSlashIcon.classList.add('hidden');
            }
        });

        // Password Strength Checker
        function checkPasswordStrength(password) {
            let strength = 0;
            let feedback = [];

            if (password.length >= 8) strength += 1;
            else feedback.push('At least 8 characters');

            if (/[a-z]/.test(password)) strength += 1;
            else feedback.push('Lowercase letter');

            if (/[A-Z]/.test(password)) strength += 1;
            else feedback.push('Uppercase letter');

            if (/[0-9]/.test(password)) strength += 1;
            else feedback.push('Number');

            if (/[^A-Za-z0-9]/.test(password)) strength += 1;
            else feedback.push('Special character');

            return { strength, feedback };
        }

        password.addEventListener('input', () => {
            const { strength, feedback } = checkPasswordStrength(password.value);

            passwordStrength.className = 'h-full password-strength transition-all duration-300';

            if (strength <= 1) {
                passwordStrength.classList.add('strength-weak');
                passwordStrengthText.textContent = 'Weak password';
                passwordStrengthText.className = 'text-xs mt-1 text-red-500';
            } else if (strength <= 2) {
                passwordStrength.classList.add('strength-fair');
                passwordStrengthText.textContent = 'Fair password';
                passwordStrengthText.className = 'text-xs mt-1 text-yellow-500';
            } else if (strength <= 3) {
                passwordStrength.classList.add('strength-good');
                passwordStrengthText.textContent = 'Good password';
                passwordStrengthText.className = 'text-xs mt-1 text-blue-500';
            } else {
                passwordStrength.classList.add('strength-strong');
                passwordStrengthText.textContent = 'Strong password';
                passwordStrengthText.className = 'text-xs mt-1 text-green-500';
            }
        });

        // Show Status Message
        function showStatus(message, type = 'info') {
            statusText.textContent = message;
            statusMessage.className = `mt-4 p-4 rounded-xl text-center ${type === 'error' ? 'bg-red-100 text-red-700' : type === 'success' ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700'}`;
            statusMessage.classList.remove('hidden');

            setTimeout(() => {
                statusMessage.classList.add('hidden');
            }, 5000);
        }

        // Loading State
        function setLoading(loading) {
            if (loading) {
                signupBtnText.classList.add('hidden');
                signupBtnSpinner.classList.remove('hidden');
                signupBtn.disabled = true;
            } else {
                signupBtnText.classList.remove('hidden');
                signupBtnSpinner.classList.add('hidden');
                signupBtn.disabled = false;
            }
        }

        // Validate Email Format
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // Validate Phone Format
        function isValidPhone(phone) {
            const phoneRegex = /^\+[1-9]\d{1,14}$/;
            return phoneRegex.test(phone);
        }

        // Validate Instagram Handle
        function isValidInstagram(handle) {
            const instagramRegex = /^@[a-zA-Z0-9._]{1,30}$/;
            return instagramRegex.test(handle);
        }

        // Signup Form Submission
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const nameValue = fullName.value.trim();
            const emailValue = email.value.trim();
            const contactValue = contact.value.trim();
            const passwordValue = password.value;
            const confirmPasswordValue = confirmPassword.value;

            // Validation
            if (!nameValue || !emailValue || !contactValue || !passwordValue || !confirmPasswordValue) {
                showStatus('Please fill in all fields', 'error');
                return;
            }

            if (!isValidEmail(emailValue)) {
                showStatus('Please enter a valid email address', 'error');
                return;
            }

            if (!isValidPhone(contactValue) && !isValidInstagram(contactValue)) {
                showStatus('Please enter a valid phone number (+9715XXXXXXX) or Instagram handle (@username)', 'error');
                return;
            }

            if (passwordValue !== confirmPasswordValue) {
                showStatus('Passwords do not match', 'error');
                return;
            }

            const { strength } = checkPasswordStrength(passwordValue);
            if (strength < 3) {
                showStatus('Password is too weak. Please use a stronger password.', 'error');
                return;
            }

            if (!agreeTerms.checked) {
                showStatus('Please agree to the Terms of Service and Privacy Policy', 'error');
                return;
            }

            setLoading(true);

            try {
                // Check if email already exists in users collection
                const emailQuery = query(collection(db, "users"), where("email", "==", emailValue));
                const emailSnapshot = await getDocs(emailQuery);

                if (!emailSnapshot.empty) {
                    throw new Error('An account with this email already exists');
                }

                // Check if contact already exists in staff collection
                const contactQuery = query(collection(db, "staff"), where("contact", "==", contactValue));
                const contactSnapshot = await getDocs(contactQuery);

                if (!contactSnapshot.empty) {
                    throw new Error('An account with this phone/Instagram already exists');
                }

                // Create Firebase Auth user
                const userCredential = await createUserWithEmailAndPassword(auth, emailValue, passwordValue);
                const user = userCredential.user;

                // Update profile with display name
                await updateProfile(user, { displayName: nameValue });

                // Generate a unique business ID
                const businessId = `business_${user.uid}_${Date.now()}`;

                // Get selected plan from URL parameter or default to starter
                const urlParams = new URLSearchParams(window.location.search);
                const selectedPlan = urlParams.get('plan') || 'starter';

                // Create business document
                await setDoc(doc(db, "businesses", businessId), {
                    id: businessId,
                    ownerUid: user.uid,
                    businessName: `${nameValue}'s Business`,
                    plan: selectedPlan,
                    staff: [],
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                });

                // Create user document with business connection
                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    email: emailValue,
                    businessId: businessId,
                    role: 'owner',
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                });

                // Create staff record for dashboard access
                await setDoc(doc(db, "staff", user.uid), {
                    name: nameValue,
                    email: emailValue,
                    contact: contactValue,
                    phone: contactValue,
                    businessId: businessId,
                    createdAt: new Date().toISOString(),
                    lastLogin: new Date().toISOString(),
                    approved: true, // Auto-approve business owners
                    permissions: {
                        home: ["view", "edit", "admin"],
                        orders: ["view", "edit", "delete", "admin"],
                        inventory: ["view", "edit", "delete", "admin"],
                        customers: ["view", "edit", "delete", "admin"],
                        employees: ["view", "edit", "delete", "admin"],
                        analytics: ["view", "edit", "delete", "admin"],
                        settings: ["view", "edit", "delete", "admin"],
                        staff: ["view", "edit", "delete", "admin"],
                        finance: ["view", "edit", "delete", "admin"],
                        reports: ["view", "edit", "delete", "admin"],
                        insights: ["view", "edit", "delete", "admin"],
                        loyalty: ["view", "edit", "delete", "admin"],
                        notifications: ["view", "edit", "delete", "admin"],
                        profile: ["view", "edit", "delete", "admin"],
                        expenses: ["view", "edit", "delete", "admin"],
                        domains: ["view", "edit", "delete", "admin"],
                        game_hub: ["view", "edit", "delete", "admin"],
                        madas_pass: ["view", "edit", "delete", "admin"],
                        scratch_card: ["view", "edit", "delete", "admin"],
                        discount_wheel: ["view", "edit", "delete", "admin"],
                        collections: ["view", "edit", "delete", "admin"],
                        deposits: ["view", "edit", "delete", "admin"],
                        low_stock: ["view", "edit", "delete", "admin"],
                        product_reviews: ["view", "edit", "delete", "admin"],
                        shares: ["view", "edit", "delete", "admin"],
                        admin: ["view", "edit", "delete", "admin"]
                    },
                    role: "owner",
                    status: "active"
                });

                // Initialize trial for the new business
                const trialExpires = new Date();
                trialExpires.setDate(trialExpires.getDate() + 15); // 15-day trial

                await setDoc(doc(db, "trials", user.uid), {
                    userId: user.uid,
                    businessId: businessId,
                    email: emailValue,
                    isActive: true,
                    trialStartDate: new Date().toISOString(),
                    trialExpiresDate: trialExpires.toISOString(),
                    createdAt: new Date().toISOString()
                });

                showStatus('🎉 Account created successfully! You now have your own business dashboard with a 15-day trial.', 'success');

                // Store user data in localStorage for dashboard access
                localStorage.setItem('currentBusinessId', businessId);
                localStorage.setItem('userEmail', emailValue);
                localStorage.setItem('userId', user.uid);
                localStorage.setItem('userRole', 'owner');
                localStorage.setItem('userName', nameValue);

                // Redirect to business dashboard
                setTimeout(() => {
                    window.location.href = `http://localhost:3001/pages/dashboard/${businessId}`;
                }, 2000);

            } catch (error) {
                console.error('Signup error:', error);

                let errorMessage = 'Signup failed. Please try again.';

                if (error.code === 'auth/email-already-in-use') {
                    errorMessage = 'An account with this email already exists.';
                } else if (error.code === 'auth/weak-password') {
                    errorMessage = 'Password is too weak. Please use a stronger password.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Please enter a valid email address.';
                } else if (error.message.includes('already exists')) {
                    errorMessage = error.message;
                }

                showStatus(errorMessage, 'error');
                signupForm.classList.add('shake');
                setTimeout(() => signupForm.classList.remove('shake'), 500);
            } finally {
                setLoading(false);
            }
        });

        // Display selected plan
        const urlParams = new URLSearchParams(window.location.search);
        const selectedPlan = urlParams.get('plan') || 'starter';
        const selectedPlanName = document.getElementById('selectedPlanName');

        if (selectedPlanName) {
            const planNames = {
                'starter': 'Starter ($29/month)',
                'professional': 'Professional ($79/month)',
                'enterprise': 'Enterprise ($199/month)'
            };
            selectedPlanName.textContent = planNames[selectedPlan] || 'Starter ($29/month)';
        }

        // Auto-focus first field
        fullName.focus();

        console.log('📋 Signup page loaded with plan:', selectedPlan);
    </script>
</body>

</html>
