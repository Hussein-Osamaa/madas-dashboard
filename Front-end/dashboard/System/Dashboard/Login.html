<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - MADAS Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="assets/img/madas-logo.png">
    <style>
        :root {
            --madas-primary: #27491F;
            --madas-dark: #F0CAE1;
            --madas-light: #F4F4F4;
            --madas-accent: #FFD300;
            --bg-main: #F4F4F4;
            --text-main: #1F2937;
            --text-secondary: #6B7280;
            --card-bg: #FFFFFF;
            --card-border: #E5E7EB;
            --sidebar-bg: #FFFFFF;
            --header-bg: #FFFFFF;
        }

        body {
            font-family: 'Inter', sans-serif;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .gradient-bg {
            background: linear-gradient(135deg, var(--madas-primary), #1f3c19);
        }

        .card-hover {
            transition: all 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .input-focus {
            transition: all 0.3s ease;
        }

        .input-focus:focus {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(39, 73, 31, 0.15);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--madas-primary), #1f3c19);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(39, 73, 31, 0.3);
        }

        .loading-spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        /* Input fields and form elements */
        input[type="text"],
        input[type="number"],
        input[type="email"],
        input[type="password"],
        textarea,
        select {
            background-color: var(--card-bg) !important;
            color: var(--text-main) !important;
            border-color: var(--card-border) !important;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        textarea:focus,
        select:focus {
            border-color: var(--madas-accent) !important;
            box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.2) !important;
        }

        input[type="text"]::placeholder,
        input[type="number"]::placeholder,
        input[type="email"]::placeholder,
        input[type="password"]::placeholder,
        textarea::placeholder {
            color: var(--text-secondary) !important;
        }

        /* Search bar specific styling */
        input[type="search"] {
            background-color: var(--card-bg) !important;
            color: var(--text-main) !important;
            border-color: var(--card-border) !important;
        }

        input[type="search"]:focus {
            border-color: var(--madas-accent) !important;
            box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.2) !important;
        }

        input[type="search"]::placeholder {
            color: var(--text-secondary) !important;
        }

        /* Select dropdowns */
        select {
            background-color: var(--card-bg) !important;
            color: var(--text-main) !important;
            border-color: var(--card-border) !important;
        }

        select:focus {
            border-color: var(--madas-accent) !important;
            box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.2) !important;
        }

        /* Modal styling */
        .modal,
        .modal .bg-white,
        .glass-effect {
            background-color: var(--card-bg) !important;
        }

        /* Form labels */
        label {
            color: var(--text-main) !important;
        }

        /* Readonly inputs */
        input[readonly] {
            background-color: var(--bg-main) !important;
            color: var(--text-secondary) !important;
        }

        /* Checkbox styling */
        input[type="checkbox"] {
            background-color: var(--card-bg) !important;
            border-color: var(--card-border) !important;
        }

        input[type="checkbox"]:checked {
            background-color: var(--madas-accent) !important;
            border-color: var(--madas-accent) !important;
        }
    </style>
</head>

<body
    class="min-h-screen bg-gradient-to-br from-[var(--madas-light)] via-white to-[var(--madas-dark)] flex items-center justify-center p-4">
    <!-- Background Pattern -->
    <div class="absolute inset-0 overflow-hidden">
        <div class="absolute -top-40 -right-40 w-80 h-80 bg-[var(--madas-accent)] rounded-full opacity-10"></div>
        <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-[var(--madas-primary)] rounded-full opacity-10"></div>
    </div>

    <!-- Main Login Container -->
    <div class="relative z-10 w-full max-w-md">
        <!-- Logo and Brand -->
        <div class="text-center mb-8">
            <div class="w-8 h-8 bg-[var(--madas-primary)] rounded-lg flex items-center justify-center">
                <img src="assets/img/madas.png" alt="Madas Logo" class="w-full h-full object-cover">
            </div>
            <h1 class="text-3xl font-bold text-[var(--madas-primary)] mb-2">Welcome Back</h1>
            <p class="text-gray-600">Sign in to your MADAS account</p>
        </div>

        <!-- Login Form -->
        <div class="glass-effect card-hover rounded-2xl p-8 shadow-xl">
            <form id="loginForm" class="space-y-6">
                <!-- Email/Phone/Instagram Input -->
                <div>
                    <label for="identifier" class="block text-sm font-semibold text-[var(--madas-primary)] mb-2">
                        Email, Phone, or Instagram
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="material-icons text-gray-400">person</span>
                        </span>
                        <input type="text" id="identifier" required placeholder="you@example.com or +9715XXXXXXX"
                            class="input-focus w-full pl-10 pr-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[var(--madas-primary)] focus:ring-4 focus:ring-[var(--madas-primary)] focus:ring-opacity-10" />
                    </div>
                </div>

                <!-- Password Input -->
                <div>
                    <label for="password" class="block text-sm font-semibold text-[var(--madas-primary)] mb-2">
                        Password
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="material-icons text-gray-400">lock</span>
                        </span>
                        <input type="password" id="password" required placeholder="••••••••"
                            class="input-focus w-full pl-10 pr-12 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[var(--madas-primary)] focus:ring-4 focus:ring-[var(--madas-primary)] focus:ring-opacity-10" />
                        <button type="button" id="togglePassword"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-[var(--madas-primary)] transition-colors">
                            <span class="material-icons" id="eyeIcon">visibility</span>
                            <span class="material-icons hidden" id="eyeSlashIcon">visibility_off</span>
                        </button>
                    </div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between">
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" id="rememberMe"
                            class="w-4 h-4 text-[var(--madas-primary)] bg-gray-100 border-gray-300 rounded focus:ring-[var(--madas-primary)] focus:ring-2">
                        <span class="ml-2 text-sm text-gray-700">Remember me</span>
                    </label>
                    <button type="button" id="forgotPasswordBtn"
                        class="text-sm text-[var(--madas-primary)] hover:text-[#1f3c19] font-medium transition-colors">
                        Forgot password?
                    </button>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="loginBtn"
                    class="btn-primary w-full text-white py-3 rounded-xl font-semibold text-lg relative overflow-hidden">
                    <span id="loginBtnText">Sign In</span>
                    <span id="loginBtnSpinner"
                        class="loading-spinner hidden absolute inset-0 flex items-center justify-center">
                        <span class="material-icons">refresh</span>
                    </span>
                </button>
            </form>

            <!-- Divider -->
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-300"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-white text-gray-500">Or continue with</span>
                </div>
            </div>

            <!-- Social Login Buttons -->
            <div class="grid grid-cols-2 gap-3">
                <button
                    class="flex items-center justify-center px-4 py-2 border border-gray-300 rounded-xl hover:bg-gray-50 transition-colors">
                    <span class="material-icons text-blue-600 mr-2">facebook</span>
                    <span class="text-sm font-medium">Facebook</span>
                </button>
                <button
                    class="flex items-center justify-center px-4 py-2 border border-gray-300 rounded-xl hover:bg-gray-50 transition-colors">
                    <span class="material-icons text-red-600 mr-2">mail</span>
                    <span class="text-sm font-medium">Google</span>
                </button>
            </div>

            <!-- Sign Up Link -->
            <p class="text-center text-sm text-gray-600 mt-6">
                Don't have an account?
                <a href="Signup.html"
                    class="text-[var(--madas-primary)] hover:text-[#1f3c19] font-semibold transition-colors">
                    Create account
                </a>
            </p>
        </div>

        <!-- Status Messages -->
        <div id="statusMessage" class="hidden mt-4 p-4 rounded-xl text-center">
            <span id="statusText"></span>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal"
        class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 p-4">
        <div class="glass-effect rounded-2xl p-8 shadow-xl w-full max-w-md max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-2xl font-bold text-[var(--madas-primary)]">Reset Password</h3>
                <button type="button" id="closeResetModalBtn" class="text-gray-400 hover:text-gray-600">
                    <span class="material-icons">close</span>
                </button>
            </div>

            <p class="text-gray-600 mb-6">Enter your email address and we'll send you a link to reset your password.</p>

            <form id="forgotPasswordForm" class="space-y-6">
                <div>
                    <label for="resetEmail" class="block text-sm font-semibold text-[var(--madas-primary)] mb-2">
                        Email Address
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="material-icons text-gray-400">email</span>
                        </span>
                        <input type="email" id="resetEmail" required placeholder="you@example.com"
                            class="input-focus w-full pl-10 pr-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[var(--madas-primary)] focus:ring-4 focus:ring-[var(--madas-primary)] focus:ring-opacity-10" />
                    </div>
                </div>

                <div class="flex justify-end space-x-3">
                    <button type="button" id="cancelResetBtn"
                        class="px-6 py-3 text-gray-600 border-2 border-gray-300 rounded-xl hover:bg-gray-50 transition-colors font-medium">
                        Cancel
                    </button>
                    <button type="submit" id="sendResetBtn"
                        class="btn-primary px-6 py-3 text-white rounded-xl font-medium">
                        Send Reset Link
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC-ls1TrvSkrw71KqmB_kHYgPoj0H550a8",
            authDomain: "madas-store.firebaseapp.com",
            projectId: "madas-store",
            storageBucket: "madas-store.firebasestorage.app",
            messagingSenderId: "527071300010",
            appId: "1:527071300010:web:70470e2204065b4590583d3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        setPersistence(auth, browserLocalPersistence).catch(console.error);

        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loginBtnText = document.getElementById('loginBtnText');
        const loginBtnSpinner = document.getElementById('loginBtnSpinner');
        const identifier = document.getElementById('identifier');
        const password = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeSlashIcon = document.getElementById('eyeSlashIcon');
        const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
        const forgotPasswordModal = document.getElementById('forgotPasswordModal');
        const closeResetModalBtn = document.getElementById('closeResetModalBtn');
        const cancelResetBtn = document.getElementById('cancelResetBtn');
        const forgotPasswordForm = document.getElementById('forgotPasswordForm');
        const resetEmail = document.getElementById('resetEmail');
        const sendResetBtn = document.getElementById('sendResetBtn');
        const statusMessage = document.getElementById('statusMessage');
        const statusText = document.getElementById('statusText');

        // Show/Hide Password Toggle
        togglePassword.addEventListener('click', () => {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);

            if (type === 'text') {
                eyeIcon.classList.add('hidden');
                eyeSlashIcon.classList.remove('hidden');
            } else {
                eyeIcon.classList.remove('hidden');
                eyeSlashIcon.classList.add('hidden');
            }
        });

        // Show Status Message
        function showStatus(message, type = 'info') {
            statusText.textContent = message;
            statusMessage.className = `mt-4 p-4 rounded-xl text-center ${type === 'error' ? 'bg-red-100 text-red-700' : type === 'success' ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700'}`;
            statusMessage.classList.remove('hidden');

            setTimeout(() => {
                statusMessage.classList.add('hidden');
            }, 5000);
        }

        // Loading State
        function setLoading(loading) {
            if (loading) {
                loginBtnText.classList.add('hidden');
                loginBtnSpinner.classList.remove('hidden');
                loginBtn.disabled = true;
            } else {
                loginBtnText.classList.remove('hidden');
                loginBtnSpinner.classList.add('hidden');
                loginBtn.disabled = false;
            }
        }

        // Login Form Submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const identifierValue = identifier.value.trim();
            const passwordValue = password.value;

            if (!identifierValue || !passwordValue) {
                showStatus('Please fill in all fields', 'error');
                return;
            }

            setLoading(true);

            try {
                // Determine if identifier is email, phone, or Instagram
                let email = identifierValue;

                if (identifierValue.includes('@')) {
                    // It's an email
                    email = identifierValue;
                } else if (identifierValue.startsWith('+')) {
                    // It's a phone number - we'll need to look it up
                    const staffQuery = await getDocs(collection(db, "staff"));
                    let foundEmail = null;

                    staffQuery.forEach(doc => {
                        const data = doc.data();
                        if (data.phone === identifierValue || data.contact === identifierValue) {
                            foundEmail = data.email;
                        }
                    });

                    if (!foundEmail) {
                        throw new Error('Phone number not found');
                    }
                    email = foundEmail;
                } else if (identifierValue.startsWith('@')) {
                    // It's an Instagram handle - we'll need to look it up
                    const staffQuery = await getDocs(collection(db, "staff"));
                    let foundEmail = null;

                    staffQuery.forEach(doc => {
                        const data = doc.data();
                        if (data.contact === identifierValue) {
                            foundEmail = data.email;
                        }
                    });

                    if (!foundEmail) {
                        throw new Error('Instagram handle not found');
                    }
                    email = foundEmail;
                }

                const userCredential = await signInWithEmailAndPassword(auth, email, passwordValue);
                const user = userCredential.user;

                // Check if user is approved
                const userDoc = await getDoc(doc(db, "staff", user.uid));
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    if (!userData.approved) {
                        await auth.signOut();
                        throw new Error('Your account is pending approval. Please contact your administrator.');
                    }
                }

                showStatus('Login successful! Redirecting...', 'success');

                // Redirect to dashboard
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);

            } catch (error) {
                console.error('Login error:', error);

                let errorMessage = 'Login failed. Please check your credentials.';

                if (error.code === 'auth/user-not-found') {
                    errorMessage = 'No account found with these credentials.';
                } else if (error.code === 'auth/wrong-password') {
                    errorMessage = 'Incorrect password. Please try again.';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMessage = 'Too many failed attempts. Please try again later.';
                } else if (error.message.includes('pending approval')) {
                    errorMessage = error.message;
                }

                showStatus(errorMessage, 'error');
                loginForm.classList.add('shake');
                setTimeout(() => loginForm.classList.remove('shake'), 500);
            } finally {
                setLoading(false);
            }
        });

        // Forgot Password Modal
        forgotPasswordBtn.addEventListener('click', () => {
            forgotPasswordModal.classList.remove('hidden');
        });

        closeResetModalBtn.addEventListener('click', () => {
            forgotPasswordModal.classList.add('hidden');
            forgotPasswordForm.reset();
        });

        cancelResetBtn.addEventListener('click', () => {
            forgotPasswordModal.classList.add('hidden');
            forgotPasswordForm.reset();
        });

        // Forgot Password Form
        forgotPasswordForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = resetEmail.value.trim();

            if (!email) {
                showStatus('Please enter your email address', 'error');
                return;
            }

            sendResetBtn.disabled = true;
            sendResetBtn.textContent = 'Sending...';

            try {
                await sendPasswordResetEmail(auth, email);
                showStatus('Password reset email sent! Check your inbox.', 'success');
                forgotPasswordModal.classList.add('hidden');
                forgotPasswordForm.reset();
            } catch (error) {
                console.error('Password reset error:', error);
                showStatus('Failed to send reset email. Please try again.', 'error');
            } finally {
                sendResetBtn.disabled = false;
                sendResetBtn.textContent = 'Send Reset Link';
            }
        });

        // Auto-focus identifier field
        identifier.focus();

        // Check auth state
        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log('User is logged in:', user.email);
                // Redirect if already logged in
                window.location.href = 'index.html';
            }
        });
    </script>
</body>

</html>
