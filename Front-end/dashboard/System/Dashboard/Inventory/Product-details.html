<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details - MADAS Dashboard</title>
    <script src="https://cdn.tailwindcss.com">
        // Inventory Dropdown functionality
        document.addEventListener("DOMContentLoaded", () => {
            const inventoryToggle = document.getElementById("inventory-toggle");
            const inventorySubmenu = document.getElementById("inventory-submenu");
            const inventoryArrow = document.getElementById("inventory-arrow");

            if (inventoryToggle && inventorySubmenu && inventoryArrow) {
                inventoryToggle.addEventListener("click", (e) => {
                    e.preventDefault();
                    const isOpen = !inventorySubmenu.classList.contains("hidden");
                    
                    if (isOpen) {
                        inventorySubmenu.classList.add("hidden");
                        inventoryArrow.style.transform = "rotate(0deg)";
                    } else {
                        inventorySubmenu.classList.remove("hidden");
                        inventoryArrow.style.transform = "rotate(180deg)";
                    }
                });
            }
        });</script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <link rel="icon" type="image/x-icon" href="../assets/images/madas-logo.png">
    <style>
        :root {
            --madas-primary: #27491F;
            --madas-dark: #F0CAE1;
            --madas-light: #F4F4F4;
            --madas-accent: #FFD300;
            --bg-main: #F4F4F4;
            --text-main: #1F2937;
            --text-secondary: #6B7280;
            --card-bg: #FFFFFF;
            --card-border: #E5E7EB;
            --sidebar-bg: #FFFFFF;
            --header-bg: #FFFFFF;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-main) !important;
            color: var(--text-main) !important;
            transition: background 0.5s, color 0.5s;
        }

        /* Dark mode styles */
        body.dark-mode {
            --madas-primary: #FFD700;
            --madas-dark: #232946;
            --madas-light: #181825;
            --madas-accent: #7209b7;
            --bg-main: #181825;
            --text-main: #F8F8F2;
            --text-secondary: #A8A8A8;
            --card-bg: #232946;
            --card-border: #2D3748;
            --sidebar-bg: #232946;
            --header-bg: #232946;
        }

        .dark-toggle {
            background: var(--madas-accent);
            border: 2px solid var(--madas-primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dark-toggle svg {
            width: 20px;
            height: 20px;
            fill: var(--madas-primary);
            transition: fill 0.3s;
        }

        .dark-toggle:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(255, 215, 0, 0.3);
        }

        .dark-toggle:active {
            transform: scale(0.95);
        }

        /* Transition all elements */
        * {
            transition: background-color 0.5s, color 0.5s, border-color 0.5s;
        }

        /* Override specific backgrounds */
        .bg-white {
            background-color: var(--card-bg) !important;
        }

        .bg-gray-50 {
            background-color: var(--bg-main) !important;
        }

        .text-gray-900 {
            color: var(--text-main) !important;
        }

        .text-gray-600 {
            color: var(--text-secondary) !important;
        }

        .text-gray-500 {
            color: var(--text-secondary) !important;
        }

        .border-gray-100 {
            border-color: var(--card-border) !important;
        }

        .border-gray-200 {
            border-color: var(--card-border) !important;
        }

        .bg-gray-100 {
            background-color: var(--card-bg) !important;
        }

        .hover\:bg-gray-100:hover {
            background-color: var(--card-bg) !important;
        }

        .hover\:bg-gray-200:hover {
            background-color: var(--card-border) !important;
        }

        /* Input fields and form elements */
        input[type="text"],
        input[type="number"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        textarea,
        select {
            background-color: var(--card-bg) !important;
            color: var(--text-main) !important;
            border-color: var(--card-border) !important;
            border-width: 1px !important;
            border-style: solid !important;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="date"]:focus,
        textarea:focus,
        select:focus {
            border-color: var(--madas-accent) !important;
            box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.2) !important;
            outline: none !important;
        }

        input[type="text"]::placeholder,
        input[type="number"]::placeholder,
        input[type="email"]::placeholder,
        input[type="password"]::placeholder,
        textarea::placeholder {
            color: var(--text-secondary) !important;
        }

        input[type="date"] {
            background-color: var(--card-bg) !important;
            color: var(--text-main) !important;
            border-color: var(--card-border) !important;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: var(--text-main) !important;
            opacity: 0.7;
        }

        input[type="date"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }

        /* Form labels */
        label {
            color: var(--text-main) !important;
        }

        /* Checkbox styling */
        input[type="checkbox"] {
            background-color: var(--card-bg) !important;
            border-color: var(--card-border) !important;
        }

        input[type="checkbox"]:checked {
            background-color: var(--madas-accent) !important;
            border-color: var(--madas-accent) !important;
        }

        /* Main content background */
        main {
            background-color: var(--bg-main) !important;
        }

        .card-hover {
            transition: all 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        @media print {
            body * {
                display: none !important;
            }

            #printContainer,
            #printContainer * {
                display: block !important;
            }

            #printContainer {
                margin: 1cm;
            }

            #printContainer .print-item {
                margin-bottom: 1cm;
                padding: 1cm;
                border: 1px solid var(--madas-primary);
                text-align: center;
                page-break-inside: avoid;
            }

            #printContainer .print-item svg {
                margin: 0 auto .3cm;
                width: 100%;
                height: auto;
            }

            #printContainer .code-text {
                font-size: 12pt;
                font-weight: bold;
                margin-bottom: .3cm;
            }

            #printContainer .desc-text {
                font-size: 30pt;
                color: var(--madas-dark);
            }
        }
    </style>

    <!-- Business Isolation Scripts -->
    <script src="../js/business-isolation.js"></script>
    <script src="../js/page-template.js"></script>
</head>

<body class="font-sans">

                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-[var(--madas-primary)] rounded-lg flex items-center justify-center">
                        <span class="text-white font-bold text-sm">M</span>
                    </div>
                    <h1 class="text-xl font-bold text-[var(--madas-primary)]">MADAS Admin</h1>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <button class="dark-toggle" id="darkToggle" title="Toggle dark mode">
                    <svg id="darkToggleIcon" viewBox="0 0 24 24">
                        <path
                            d="M12 2a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1zm5.657 3.343a1 1 0 0 1 1.414 0l.707.707a1 1 0 1 1-1.414 1.414l-.707-.707a1 1 0 0 1 0-1.414zM21 11a1 1 0 1 1 0 2h-1a1 1 0 1 1 0-2h1zm-2.929 7.071a1 1 0 0 1 0 1.414l-.707.707a1 1 0 1 1-1.414-1.414l.707-.707a1 1 0 0 1 1.414 0zM12 20a1 1 0 0 1-1-1v-1a1 1 0 1 1 2 0v1a1 1 0 0 1-1 1zm-7.071-2.929a1 1 0 0 1-1.414 0l-.707-.707a1 1 0 1 1 1.414-1.414l.707.707a1 1 0 0 1 0 1.414zM4 13a1 1 0 1 1 0-2H3a1 1 0 1 1 0 2h1zm2.343-7.657a1 1 0 0 1 0 1.414l-.707.707A1 1 0 1 1 4.222 6.05l.707-.707a1 1 0 0 1 1.414 0zM12 6a6 6 0 1 1 0 12A6 6 0 0 1 12 6z" />
                    </svg>
                </button>
                <!-- Add any other header controls here, such as notifications, profile, logout -->
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="pt-16 min-h-screen">
        <div class="max-w-4xl mx-auto p-6 lg:p-8">
            <!-- Loading State -->
            <div id="loadingState" class="text-center py-12">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-[var(--madas-primary)] mx-auto mb-4">
                </div>
                <p class="text-gray-600">Loading product details...</p>
            </div>

            <!-- Product Details -->
            <div id="productDetails" class="hidden">
                <!-- Product Header -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
                    <div class="flex items-start justify-between">
                        <div class="flex-1">
                            <h1 id="productName" class="text-3xl font-bold text-[var(--madas-primary)] mb-2"></h1>
                            <p id="productDescription" class="text-gray-600 mb-4"></p>
                            <div class="flex items-center space-x-6 text-sm">
                                <div>
                                    <span class="text-gray-500">Price:</span>
                                    <span id="productPrice"
                                        class="font-semibold text-[var(--madas-primary)] ml-1"></span>
                                </div>
                                <div>

                                <div>

    <!-- Print Container -->
    <div id="printContainer" class="hidden"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC-ls1TrvSkrw71KqmB_kHYgPoj0H550a8",
            authDomain: "madas-store.firebaseapp.com",
            projectId: "madas-store",
            storageBucket: "madas-store.appspot.com",
            messagingSenderId: "527071300010",
            appId: "1:527071300010:web:70470e2204065b4590583d3",
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const params = new URLSearchParams(window.location.search);
        const productId = params.get("id");

        let productData = null;
        let selectedVariants = new Set();

        // Initialize page
        document.addEventListener("DOMContentLoaded", () => {
            setupEventListeners();
            if (productId) {
                loadProduct();
            } else {
                showError("No product ID provided");
            }
        });

        function setupEventListeners() {
            // Back button
            document.getElementById("backBtn").addEventListener("click", () => {
                window.history.back();
            });

            // Back to products button
            document.getElementById("backToProductsBtn").addEventListener("click", () => {
                window.location.href = "./products.html";
            });

            // Edit product button
            document.getElementById("editProductBtn").addEventListener("click", () => {
                window.location.href = `./products.html?edit=${productId}`;
            });

            // Print barcodes button
            document.getElementById("printBarcodesBtn").addEventListener("click", printSelectedBarcodes);

            // Select all variants
            document.getElementById("selectAllVariants").addEventListener("change", (e) => {
                const checkboxes = document.querySelectorAll('.variant-checkbox');
                checkboxes.forEach(checkbox => {
                    checkbox.checked = e.target.checked;
                    handleVariantSelection(checkbox.value, e.target.checked);
                });
            });
        }

        async function loadProduct() {
            try {
                const docSnap = await getDoc(doc(db, "products", productId));

                if (!docSnap.exists()) {
                    showError("Product not found");
                    return;
                }

                productData = { id: docSnap.id, ...docSnap.data() };
                renderProduct();
                hideLoading();
            } catch (error) {
                console.error("Error loading product:", error);
                showError("Failed to load product");
            }
        }

        function renderProduct() {
            // Update page title
            document.title = `${productData.name} - MADAS Dashboard`;

            // Product header
            document.getElementById("productName").textContent = productData.name || "Unnamed Product";
            document.getElementById("productDescription").textContent = productData.description || "No description available";
            document.getElementById("productPrice").textContent = `$${(productData.price || 0).toFixed(2)}`;
            document.getElementById("productSKU").textContent = productData.sku || "N/A";
            document.getElementById("productLowStock").textContent = productData.lowStockAlert || 5;

            // Main barcode
            const mainBarcode = productData.barcode || productData.sku || "N/A";
            document.getElementById("mainBarcode").textContent = mainBarcode;

            if (window.JsBarcode && mainBarcode !== "N/A") {
                window.JsBarcode("#mainBarcodeSvg", mainBarcode, {
                    format: "CODE128",
                    displayValue: true,
                    fontSize: 14,
                    lineColor: "#000",
                    width: 2,
                    height: 60
                });
            }

            // Size variants
            renderSizeVariants(productData.sizes || {});
        }

        function renderSizeVariants(sizes) {
            const grid = document.getElementById("sizeVariantsGrid");

            if (!sizes || Object.keys(sizes).length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-8">
                        <div class="text-gray-500">
                            <span class="material-icons text-4xl mb-2">inventory_2</span>
                            <p>No size variants available</p>
                        </div>
                    </div>
                `;
                return;
            }

            grid.innerHTML = Object.entries(sizes)
                .map(([size, data]) => {
                    const quantity = data.quantity || 0;
                    const barcode = data.barcode || `${productData.barcode || productData.sku}-${size}`;
                    const stockStatus = quantity === 0 ? "text-red-600" :
                        quantity <= (productData.lowStockAlert || 5) ? "text-orange-600" : "text-green-600";

                    return `
                        <div class="card-hover bg-gray-50 rounded-lg p-4 border border-gray-200">
                            <div class="flex items-start justify-between mb-3">
                                <div class="flex items-center space-x-2">
                                    <input type="checkbox" class="variant-checkbox w-4 h-4 text-[var(--madas-primary)] bg-gray-100 border-gray-300 rounded focus:ring-[var(--madas-accent)] focus:ring-2" 
                                           value="${barcode}" data-size="${size}" data-quantity="${quantity}" 
                                           ${quantity === 0 ? 'disabled' : ''}>
                                    <h3 class="font-semibold text-lg">${size}</h3>
                                </div>
                                <span class="text-sm font-medium ${stockStatus}">
                                    ${quantity} in stock
                                </span>
                            </div>
                            
                            <div class="space-y-2 text-sm">
                                <div>
                                    <span class="text-gray-500">Barcode:</span>
                                    <span class="font-mono ml-1">${barcode}</span>
                                </div>
                                <div>
                                    <span class="text-gray-500">Quantity:</span>
                                    <span class="font-semibold ml-1">${quantity}</span>
                                </div>
                            </div>
                            
                            <div class="mt-3 pt-3 border-t border-gray-200">
                                <svg id="barcode-${size}" class="w-full h-12"></svg>
                            </div>
                        </div>
                    `;
                })
                .join("");

            // Generate barcodes and add event listeners
            Object.entries(sizes).forEach(([size, data]) => {
                const barcode = data.barcode || `${productData.barcode || productData.sku}-${size}`;
                const svg = document.getElementById(`barcode-${size}`);

                if (window.JsBarcode && svg) {
                    window.JsBarcode(svg, barcode, {
                        format: "CODE128",
                        displayValue: true,
                        fontSize: 10,
                        lineColor: "#000",
                        width: 1.5,
                        height: 40
                    });
                }

                // Add checkbox event listener
                const checkbox = document.querySelector(`input[value="${barcode}"]`);
                if (checkbox) {
                    checkbox.addEventListener("change", (e) => {
                        handleVariantSelection(e.target.value, e.target.checked);
                    });
                }
            });
        }

        function handleVariantSelection(barcode, isChecked) {
            if (isChecked) {
                selectedVariants.add(barcode);
            } else {
                selectedVariants.delete(barcode);
            }
            updateSelectedCount();
        }

        function updateSelectedCount() {
            const count = selectedVariants.size;
            document.getElementById("selectedVariantsCount").textContent = `${count} selected`;

            // Update select all checkbox
            const totalCheckboxes = document.querySelectorAll('.variant-checkbox:not(:disabled)').length;
            const checkedCheckboxes = document.querySelectorAll('.variant-checkbox:checked').length;
            const selectAllCheckbox = document.getElementById("selectAllVariants");

            if (checkedCheckboxes === 0) {
                selectAllCheckbox.indeterminate = false;
                selectAllCheckbox.checked = false;
            } else if (checkedCheckboxes === totalCheckboxes) {
                selectAllCheckbox.indeterminate = false;
                selectAllCheckbox.checked = true;
            } else {
                selectAllCheckbox.indeterminate = true;
            }
        }

        function printSelectedBarcodes() {
            if (selectedVariants.size === 0) {
                alert("Please select at least one size variant to print");
                return;
            }

            const container = document.getElementById("printContainer");
            container.innerHTML = "";
            container.classList.remove("hidden");

            selectedVariants.forEach(barcode => {
                const size = Object.keys(productData.sizes || {}).find(size => {
                    const data = productData.sizes[size];
                    return (data.barcode || `${productData.barcode || productData.sku}-${size}`) === barcode;
                });

                if (size) {
                    // Print only one barcode per selected variant
                    const wrapper = document.createElement("div");
                    wrapper.className = "print-item";

                    const codeText = document.createElement("div");
                    codeText.className = "code-text";
                    codeText.textContent = barcode;

                    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                    window.JsBarcode(svg, barcode, {
                        format: "CODE128",
                        displayValue: true,
                        fontSize: 14,
                        lineColor: "#000",
                        width: 2,
                        height: 60
                    });

                    const descText = document.createElement("div");
                    descText.className = "desc-text";
                    descText.textContent = `${productData.name} Size ${size}`;

                    wrapper.appendChild(codeText);
                    wrapper.appendChild(svg);
                    wrapper.appendChild(descText);

                    container.appendChild(wrapper);
                }
            });

            window.print();

            setTimeout(() => {
                container.innerHTML = "";
                container.classList.add("hidden");
            }, 1000);
        }

        function showLoading() {
            document.getElementById("loadingState").classList.remove("hidden");
            document.getElementById("productDetails").classList.add("hidden");
            document.getElementById("errorState").classList.add("hidden");
        }

        function hideLoading() {
            document.getElementById("loadingState").classList.add("hidden");
            document.getElementById("productDetails").classList.remove("hidden");
        }

        function showError(message) {
            document.getElementById("loadingState").classList.add("hidden");
            document.getElementById("productDetails").classList.add("hidden");
            document.getElementById("errorState").classList.remove("hidden");

            const errorTitle = document.querySelector("#errorState h3");
            if (errorTitle) {
                errorTitle.textContent = message;
            }
        }

        // Dark mode toggle functionality
        const darkToggle = document.getElementById('darkToggle');
        const darkIcon = document.getElementById('darkToggleIcon');

        function setDarkMode(on) {
            document.body.classList.toggle('dark-mode', on);
            localStorage.setItem('dark-mode', on ? '1' : '0');
            if (on) {
                darkIcon.innerHTML = '<path d="M21.64 13.64A9 9 0 1 1 10.36 2.36a7 7 0 1 0 11.28 11.28z"/>';
            } else {
