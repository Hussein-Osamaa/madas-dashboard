<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Test Login - MADAS Mobile Dashboard</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Mobile App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="MADAS Mobile">
    <meta name="application-name" content="MADAS Mobile">

    <!-- Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Test Users Script -->
    <script src="test-users.js"></script>

    <style>
        :root {
            --madas-primary: #27491F;
            --madas-dark: #F0CAE1;
            --madas-light: #F4F4F4;
            --madas-accent: #FFD300;
            --bg-main: #F4F4F4;
            --text-main: #1F2937;
            --text-secondary: #6B7280;
            --card-bg: #FFFFFF;
            --card-border: #E5E7EB;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        .gradient-bg {
            background: linear-gradient(135deg, var(--madas-primary), #1f3c19);
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .test-user-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .test-user-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .test-user-card:active {
            transform: translateY(0);
        }
    </style>
</head>

<body class="min-h-screen gradient-bg flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mx-auto mb-4">
                <img src="assets/img/madas.png" alt="MADAS" class="w-12 h-12">
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">MADAS Mobile</h1>
            <p class="text-white text-opacity-90">Test Login - Choose a test user</p>
        </div>

        <!-- Test Users -->
        <div class="glass-effect rounded-2xl p-6 shadow-xl">
            <h2 class="text-xl font-semibold text-[var(--madas-primary)] mb-6 text-center">Test Users</h2>

            <div id="test-users-list" class="space-y-4">
                <!-- Test users will be populated here -->
            </div>

            <div class="mt-6 pt-6 border-t border-gray-200">
                <div class="text-center">
                    <p class="text-sm text-gray-600 mb-4">All test users use password: <strong>test123</strong></p>
                    <button id="setup-test-data-btn"
                        class="bg-[var(--madas-primary)] text-white px-6 py-2 rounded-lg hover:bg-opacity-90 transition-colors">
                        Setup Test Data
                    </button>
                </div>
            </div>
        </div>

        <!-- Quick Access -->
        <div class="mt-6 text-center">
            <a href="index.html" class="text-white text-opacity-90 hover:text-white transition-colors">
                Skip Login (Direct Access)
            </a>
        </div>
    </div>

    <script>
        // Test Login Management
        document.addEventListener('DOMContentLoaded', function () {
            setupTestLogin();
        });

        function setupTestLogin() {
            // Setup test data
            setupTestData();

            // Display test users
            displayTestUsers();

            // Setup event listeners
            setupEventListeners();
        }

        function displayTestUsers() {
            const testUsers = getTestCredentials();
            const usersList = document.getElementById('test-users-list');

            usersList.innerHTML = testUsers.map((user, index) => `
                <div class="test-user-card bg-white rounded-xl p-4 border border-gray-200" data-user-id="test_user_00${index + 1}">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 bg-[var(--madas-primary)] rounded-full flex items-center justify-center text-white font-bold">
                            ${user.name.split(' ').map(n => n[0]).join('')}
                        </div>
                        <div class="flex-1">
                            <h3 class="font-semibold text-gray-900">${user.name}</h3>
                            <p class="text-sm text-gray-600">${user.email}</p>
                            <p class="text-xs text-[var(--madas-primary)] font-medium">${user.company} • ${user.plan}</p>
                        </div>
                        <div class="text-right">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                                Active
                            </span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function setupEventListeners() {
            // Test user card clicks
            document.querySelectorAll('.test-user-card').forEach(card => {
                card.addEventListener('click', function () {
                    const userId = this.getAttribute('data-user-id');
                    loginAsTestUser(userId);
                });
            });

            // Setup test data button
            document.getElementById('setup-test-data-btn').addEventListener('click', function () {
                setupTestData();
                alert('Test data setup complete!');
            });
        }

        function loginAsTestUser(userId) {
            // Create user session
            if (createTestUserSession(userId)) {
                // Redirect to mobile dashboard
                window.location.href = 'index.html';
            } else {
                alert('Failed to create test user session');
            }
        }

        // Quick login functions
        function quickLogin(userIndex) {
            const userId = `test_user_00${userIndex + 1}`;
            loginAsTestUser(userId);
        }

        // Make quick login available globally
        window.quickLogin = quickLogin;
    </script>
</body>

</html>
