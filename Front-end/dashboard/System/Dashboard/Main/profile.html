<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - MADAS Dashboard</title>
    <script src="https://cdn.tailwindcss.com">
        // Inventory Dropdown functionality
        document.addEventListener("DOMContentLoaded", () => {
            const inventoryToggle = document.getElementById("inventory-toggle");
            const inventorySubmenu = document.getElementById("inventory-submenu");
            const inventoryArrow = document.getElementById("inventory-arrow");

            if (inventoryToggle && inventorySubmenu && inventoryArrow) {
                inventoryToggle.addEventListener("click", (e) => {
                    e.preventDefault();
                    const isOpen = !inventorySubmenu.classList.contains("hidden");
                    
                    if (isOpen) {
                        inventorySubmenu.classList.add("hidden");
                        inventoryArrow.style.transform = "rotate(0deg)";
                    } else {
                        inventorySubmenu.classList.remove("hidden");
                        inventoryArrow.style.transform = "rotate(180deg)";
                    }
                });
            }
        });</script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../assets/img/madas-logo.png">
    <style>
        :root {
            --madas-primary: #27491F;
            --madas-dark: #F0CAE1;
            --madas-light: #F4F4F4;
            --madas-accent: #FFD300;
            --bg-main: #F4F4F4;
            --text-main: #1F2937;
            --text-secondary: #6B7280;
            --card-bg: #FFFFFF;
            --card-border: #E5E7EB;
            --sidebar-bg: #FFFFFF;
            --header-bg: #FFFFFF;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-main) !important;
            color: var(--text-main) !important;
            transition: background 0.5s, color 0.5s;
        }

        /* Dark mode styles */
        body.dark-mode {
            --madas-primary: #FFD700;
            --madas-dark: #232946;
            --madas-light: #181825;
            --madas-accent: #7209b7;
            --bg-main: #181825;
            --text-main: #F8F8F2;
            --text-secondary: #A8A8A8;
            --card-bg: #232946;
            --card-border: #2D3748;
            --sidebar-bg: #232946;
            --header-bg: #232946;
            background: var(--bg-main);
            color: var(--text-main);
        }

        .dark-toggle {
            background: var(--madas-accent);
            border: 2px solid var(--madas-primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dark-toggle svg {
            width: 20px;
            height: 20px;
            fill: var(--madas-primary);
            transition: fill 0.3s;
        }

        .dark-toggle:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(255, 215, 0, 0.3);
        }

        .dark-toggle:active {
            transform: scale(0.95);
        }

        /* Transition all elements */
        * {
            transition: background-color 0.5s, color 0.5s, border-color 0.5s;
        }

        /* Override specific backgrounds */
        .bg-white {
            background-color: var(--card-bg) !important;
        }

        .bg-gray-50 {
            background-color: var(--bg-main) !important;
        }

        .text-gray-900 {
            color: var(--text-main) !important;
        }

        .text-gray-600 {
            color: var(--text-secondary) !important;
        }

        .text-gray-500 {
            color: var(--text-secondary) !important;
        }

        .text-gray-700 {
            color: var(--text-main) !important;
        }

        .border-gray-100 {
            border-color: var(--card-border) !important;
        }

        .border-gray-200 {
            border-color: var(--card-border) !important;
        }

        .border-gray-300 {
            border-color: var(--card-border) !important;
        }

        .bg-gray-100 {
            background-color: var(--card-bg) !important;
        }

        .hover\:bg-gray-100:hover {
            background-color: var(--card-bg) !important;
        }

        .hover\:bg-gray-200:hover {
            background-color: var(--card-border) !important;
        }

        /* Input fields and form elements */
        input[type="text"],
        input[type="number"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        textarea,
        select {
            background-color: var(--card-bg) !important;
            color: var(--text-main) !important;
            border-color: var(--card-border) !important;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="date"]:focus,
        textarea:focus,
        select:focus {
            border-color: var(--madas-accent) !important;
            box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.2) !important;
        }

        input[type="text"]::placeholder,
        input[type="number"]::placeholder,
        input[type="email"]::placeholder,
        input[type="password"]::placeholder,
        textarea::placeholder {
            color: var(--text-secondary) !important;
        }

        /* Date input calendar picker styling */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: var(--text-main) !important;
            opacity: 0.7;
        }

        body.dark-mode input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1) !important;
        }

        /* Form labels */
        label {
            color: var(--text-main) !important;
        }

        /* Modal styling */
        .modal,
        .modal .bg-white {
            background-color: var(--card-bg) !important;
        }

        /* Loading screen */
        #loadingScreen {
            background-color: var(--bg-main) !important;
        }

        /* Purple theme elements for dark mode */
        .bg-purple-50 {
            background-color: rgba(147, 51, 234, 0.1) !important;
        }

        .text-purple-700 {
            color: #a855f7 !important;
        }

        .text-purple-600 {
            color: #9333ea !important;
        }

        .bg-purple-100 {
            background-color: rgba(147, 51, 234, 0.2) !important;
        }

        .bg-purple-600 {
            background-color: #9333ea !important;
        }

        .hover\:bg-purple-700:hover {
            background-color: #7c3aed !important;
        }

        body.dark-mode .bg-purple-50 {
            background-color: rgba(147, 51, 234, 0.15) !important;
        }

        body.dark-mode .text-purple-700 {
            color: #c084fc !important;
        }

        body.dark-mode .text-purple-600 {
            color: #a855f7 !important;
        }

        body.dark-mode .bg-purple-100 {
            background-color: rgba(147, 51, 234, 0.25) !important;
        }

        body.dark-mode .bg-purple-600 {
            background-color: #a855f7 !important;
        }

        body.dark-mode .hover\:bg-purple-700:hover {
            background-color: #9333ea !important;
        }

        .card-hover {
            transition: all 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .gradient-bg {
            background: linear-gradient(135deg, var(--madas-primary), #1f3c19);
        }
    </style>

    <!-- Business Isolation Scripts -->
    <script src="../js/business-isolation.js"></script>
    <script src="../js/page-template.js"></script>
</head>

<body class="font-sans">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200 fixed top-0 left-0 right-0 z-40 h-16">
        <div class="flex items-center justify-between h-full px-4 lg:px-6">
            <div class="flex items-center space-x-4">
                <button id="back-btn" class="text-[var(--madas-primary)] p-2 rounded-lg hover:bg-gray-100">
                    <span class="material-icons">arrow_back</span>
                </button>
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-[var(--madas-primary)] rounded-lg flex items-center justify-center">
                        <img src="../assets/img/madas.png" alt="Madas Logo" class="w-full h-full object-cover">
                    </div>
                    <h1 class="text-xl font-bold text-[var(--madas-primary)]">MADAS Admin</h1>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <button class="dark-toggle" id="darkToggle" title="Toggle dark mode">
                    <svg id="darkToggleIcon" viewBox="0 0 24 24">
                        <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
                <div class="hidden md:flex items-center space-x-2 text-sm text-gray-600">
                    <span class="material-icons text-[var(--madas-primary)]">notifications</span>
                    <span class="bg-red-500 text-white text-xs rounded-full px-2 py-1">3</span>
                </div>
                <div class="flex items-center space-x-3">
                    <div class="hidden md:block text-right">
                        <p id="user-name" class="text-sm font-medium text-gray-900">Loading...</p>
                        <p id="user-email" class="text-xs text-gray-500">loading@example.com</p>
                    </div>
                    <button id="profile-btn"
                        class="w-8 h-8 bg-[var(--madas-accent)] rounded-full flex items-center justify-center hover:bg-yellow-400 transition-colors cursor-pointer">
                        <span class="text-[var(--madas-primary)] font-bold text-sm" id="user-initial">U</span>
                    </button>
                    <button id="logout-btn"
                        class="text-gray-500 hover:text-[var(--madas-primary)] p-2 rounded-lg hover:bg-gray-100">
                        <span class="material-icons">logout</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="pt-16 min-h-screen">
        <div class="p-6 lg:p-8 max-w-4xl mx-auto">
            <!-- Profile Section -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-8 flex items-center space-x-6">
                <div class="w-20 h-20 bg-[var(--madas-accent)] rounded-full flex items-center justify-center text-4xl font-bold text-[var(--madas-primary)]"
                    id="profile-initial">U</div>
                <div>
                    <h2 class="text-2xl font-bold text-[var(--madas-primary)] mb-1" id="profile-name">Loading...</h2>
                    <p class="text-gray-600" id="profile-email">loading@example.com</p>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Profile Update Section -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                    <h3 class="text-xl font-semibold text-[var(--madas-primary)] mb-4">Update Profile</h3>
                    <form id="profileForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Display Name</label>
                            <input type="text" id="displayName"
                                class="w-full border border-gray-300 px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-[var(--madas-accent)]" />
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
                            <input type="password" id="newPassword"
                                class="w-full border border-gray-300 px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-[var(--madas-accent)]" />
                        </div>
                        <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
                            <button type="submit"
                                class="bg-[var(--madas-primary)] text-white px-6 py-2 rounded-lg hover:bg-[#1f3c19] transition-colors">Save
                                Changes</button>
                        </div>
                    </form>
                </div>

                <!-- Personal Expenses Section -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-xl font-semibold text-[var(--madas-primary)]">Personal Expenses</h3>
                        <button id="addPersonalExpenseBtn"
                            class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition-colors flex items-center space-x-2">
                            <span class="material-icons text-sm">add</span>
                            <span>Add Expense</span>
                        </button>
                    </div>

                    <!-- Personal Expenses Summary -->
                    <div class="bg-purple-50 rounded-lg p-4 mb-4">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm font-medium text-purple-700">Total Personal Expenses</p>
                                <p id="personal-expenses-total" class="text-2xl font-bold text-purple-600">EGP0</p>
                            </div>
                            <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center">
                                <span class="material-icons text-purple-600">account_balance_wallet</span>
                            </div>
                        </div>
                    </div>

                    <!-- Recent Personal Expenses -->
                    <div>
                        <h4 class="text-sm font-medium text-gray-700 mb-3">Recent Personal Expenses</h4>
                        <div id="personal-expenses-list" class="space-y-2 max-h-48 overflow-y-auto">
                            <div class="text-center text-gray-500 py-4">
                                <span class="material-icons text-2xl mb-2">receipt_long</span>
                                <p class="text-sm">No personal expenses yet</p>
                            </div>
                        </div>
                    </div>

                    <!-- View All Button -->
                    <div class="mt-4 pt-4 border-t border-gray-200">
                        <button id="viewAllExpensesBtn"
                            class="w-full bg-gray-100 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-200 transition-colors flex items-center justify-center space-x-2">
                            <span class="material-icons text-sm">visibility</span>
                            <span>View All Expenses</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Personal Expense Modal -->
    <div id="personalExpenseModal"
        class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md">
            <div class="p-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-xl font-semibold text-[var(--madas-primary)]">Add Personal Expense</h3>
                    <button id="closePersonalExpenseModal" class="text-gray-400 hover:text-gray-600">
                        <span class="material-icons">close</span>
                    </button>
                </div>
                <form id="personalExpenseForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                        <input type="text" id="expenseDescription" required
                            class="w-full border border-gray-300 px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-[var(--madas-accent)]" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Amount (EGP)</label>
                        <input type="number" id="expenseAmount" required min="0" step="0.01"
                            class="w-full border border-gray-300 px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-[var(--madas-accent)]" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
                        <input type="date" id="expenseDate" required
                            class="w-full border border-gray-300 px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-[var(--madas-accent)]" />
                    </div>
                    <div class="flex justify-end space-x-3 pt-4">
                        <button type="button" id="cancelPersonalExpense"
                            class="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-200 transition-colors">Cancel</button>
                        <button type="submit"
                            class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition-colors">Add
                            Expense</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { firebaseApp, auth, db } from "../firebaseConfig.js";
        import { collection, query, where, getDocs, addDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { onAuthStateChanged, updateProfile, updatePassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        let currentUser = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "../Login.html";
                return;
            }
            currentUser = user;

            // Check if user is in staff collection
            const q = query(collection(db, "staff"), where("email", "==", user.email));
            const querySnapshot = await getDocs(q);
            let isOwner = false;

            if (!querySnapshot.empty) {
                const staffData = querySnapshot.docs[0].data();
                isOwner = staffData.role === "owner";
            }

            // Update UI
            document.getElementById("user-name").textContent = user.displayName || user.email.split("@")[0];
            document.getElementById("user-email").textContent = user.email;
            document.getElementById("user-initial").textContent = (user.displayName ? user.displayName[0] : user.email[0]).toUpperCase();
            document.getElementById("profile-name").textContent = user.displayName || user.email.split("@")[0];
            document.getElementById("profile-email").textContent = user.email;
            document.getElementById("profile-initial").textContent = (user.displayName ? user.displayName[0] : user.email[0]).toUpperCase();
            document.getElementById("displayName").value = user.displayName || "";

            // Show/hide personal expenses section based on role
            const personalExpensesSection = document.querySelector('.bg-white.rounded-xl.shadow-sm.border.border-gray-100.p-6:last-child');
            if (personalExpensesSection) {
                if (isOwner) {
                    personalExpensesSection.style.display = 'block';
                    // Load personal expenses for owners
                    await loadPersonalExpenses();
                } else {
                    personalExpensesSection.style.display = 'none';
                }
            }

            // Load shareholder data if available
            loadShareholderData();
        });

        // Back button
        document.getElementById("back-btn").addEventListener("click", () => {
            window.location.href = "../index.html";
        });

        // Logout logic
        const logoutBtn = document.getElementById("logout-btn");
        if (logoutBtn) {
            logoutBtn.addEventListener("click", () => {
                signOut(auth).then(() => {
                    window.location.href = "../Login.html";
                });
            });
        }

        // Profile update logic
        document.getElementById("profileForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if (!user) return;
            const displayName = document.getElementById("displayName").value.trim();
            const newPassword = document.getElementById("newPassword").value.trim();
            try {
                if (displayName && displayName !== user.displayName) {
                    await updateProfile(user, { displayName });
                }
                if (newPassword) {
                    await updatePassword(user, newPassword);
                }
                alert("Profile updated successfully!");
                window.location.reload();
            } catch (error) {
                alert("Error updating profile: " + error.message);
            }
        });

        // Personal Expenses Modal
        const personalExpenseModal = document.getElementById("personalExpenseModal");
        const addPersonalExpenseBtn = document.getElementById("addPersonalExpenseBtn");
        const closePersonalExpenseModal = document.getElementById("closePersonalExpenseModal");
        const cancelPersonalExpense = document.getElementById("cancelPersonalExpense");

        addPersonalExpenseBtn.addEventListener("click", () => {
            personalExpenseModal.classList.remove("hidden");
            document.getElementById("expenseDate").value = new Date().toISOString().split('T')[0];
        });

        closePersonalExpenseModal.addEventListener("click", () => {
            personalExpenseModal.classList.add("hidden");
        });

        cancelPersonalExpense.addEventListener("click", () => {
            personalExpenseModal.classList.add("hidden");
        });

        // Close modal when clicking outside
        personalExpenseModal.addEventListener("click", (e) => {
            if (e.target === personalExpenseModal) {
                personalExpenseModal.classList.add("hidden");
            }
        });

        // Personal Expense Form
        document.getElementById("personalExpenseForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const description = document.getElementById("expenseDescription").value.trim();
            const amount = parseFloat(document.getElementById("expenseAmount").value);
            const date = document.getElementById("expenseDate").value;

            if (!description || !amount || !date) {
                alert("Please fill in all fields");
                return;
            }

            try {
                await addDoc(collection(db, "expenses"), {
                    description,
                    amount,
                    date,
                    category: "Personal",
                    userId: currentUser.uid,
                    userEmail: currentUser.email,
                    createdAt: new Date(),
                    type: "personal"
                });

                personalExpenseModal.classList.add("hidden");
                document.getElementById("personalExpenseForm").reset();
                await loadPersonalExpenses();
                alert("Personal expense added successfully!");
            } catch (error) {
                alert("Error adding expense: " + error.message);
            }
        });

        // View All Expenses Button
        document.getElementById("viewAllExpensesBtn").addEventListener("click", () => {
            window.location.href = "./expenses.html";
        });

        // Load Personal Expenses
        async function loadPersonalExpenses() {
            try {
                const q = query(
                    collection(db, "expenses"),
                    where("category", "==", "Personal"),
                    where("userEmail", "==", currentUser.email)
                );
                const querySnapshot = await getDocs(q);

                const expenses = querySnapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                })).sort((a, b) => {
                    // Sort by createdAt in descending order (most recent first)
                    const dateA = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(a.createdAt);
                    const dateB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.createdAt);
                    return dateB - dateA;
                });

                // Update total
                const total = expenses.reduce((sum, expense) => sum + expense.amount, 0);
                document.getElementById("personal-expenses-total").textContent = `EGP${total.toLocaleString()}`;

                // Update list
                const expensesList = document.getElementById("personal-expenses-list");
                if (expenses.length === 0) {
                    expensesList.innerHTML = `
                        <div class="text-center text-gray-500 py-4">
                            <span class="material-icons text-2xl mb-2">receipt_long</span>
                            <p class="text-sm">No personal expenses yet</p>
                        </div>
                    `;
                } else {
                    const recentExpenses = expenses.slice(0, 5); // Show only 5 most recent
                    expensesList.innerHTML = recentExpenses.map(expense => `
                        <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                            <div>
                                <p class="text-sm font-medium text-gray-900">${expense.description}</p>
                                <p class="text-xs text-gray-500">${new Date(expense.date).toLocaleDateString()}</p>
                            </div>
                            <span class="text-sm font-semibold text-purple-600">EGP${expense.amount.toLocaleString()}</span>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error("Error loading personal expenses:", error);
            }
        }

        // Load shareholder data
        function loadShareholderData() {
            try {
                const selectedShareholder = localStorage.getItem('madas_selected_shareholder');
                if (selectedShareholder) {
                    const shareholder = JSON.parse(selectedShareholder);
                    displayShareholderInfo(shareholder);
                    // Clear the selected shareholder data after displaying
                    localStorage.removeItem('madas_selected_shareholder');
                }
            } catch (error) {
                console.error("Error loading shareholder data:", error);
            }
        }

        // Display shareholder information
        function displayShareholderInfo(shareholder) {
            // Create shareholder info section
            const shareholderSection = document.createElement('div');
            shareholderSection.className = 'bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6';
            shareholderSection.innerHTML = `
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-xl font-bold text-gray-900">Shareholder Information</h3>
                    <button onclick="this.parentElement.parentElement.remove()" class="text-gray-500 hover:text-gray-700">
                        <span class="material-icons">close</span>
                    </button>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                            <p class="text-lg font-semibold text-gray-900">${shareholder.name}</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                            <p class="text-gray-900">${shareholder.email}</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                            <p class="text-gray-900">${shareholder.phone || 'Not provided'}</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Join Date</label>
                            <p class="text-gray-900">${new Date(shareholder.joinDate).toLocaleDateString()}</p>
                        </div>
                    </div>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Shares Owned</label>
                            <p class="text-2xl font-bold text-[var(--madas-primary)]">${shareholder.shares}</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Share Percentage</label>
                            <p class="text-2xl font-bold text-[var(--madas-primary)]">${shareholder.percentage}%</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Investment Amount</label>
                            <p class="text-2xl font-bold text-green-600">${shareholder.investment.toLocaleString()} EGP</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                            <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium ${shareholder.status === 'active' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                                ${shareholder.status.charAt(0).toUpperCase() + shareholder.status.slice(1)}
                            </span>
                        </div>
                    </div>
                </div>
                
                <div class="mt-6 p-4 bg-gradient-to-r from-[var(--madas-primary)] to-[#2d5a25] rounded-lg text-white">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-lg font-semibold">Estimated Profit Share</p>
                            <p class="text-sm opacity-90">Based on current company performance</p>
                        </div>
                        <div class="text-right">
                            <p class="text-3xl font-bold">${calculateShareholderProfit(shareholder).toLocaleString()} EGP</p>
                            <p class="text-sm opacity-90">${shareholder.percentage}% of total profit</p>
                        </div>
                    </div>
                </div>
            `;

            // Insert the shareholder section before the personal expenses section
            const personalExpensesSection = document.querySelector('.bg-white.rounded-xl.shadow-sm.border.border-gray-100.p-6:last-child');
            if (personalExpensesSection) {
                personalExpensesSection.parentNode.insertBefore(shareholderSection, personalExpensesSection);
            } else {
                // If no personal expenses section, append to the main content
                const mainContent = document.querySelector('.space-y-6');
                if (mainContent) {
                    mainContent.appendChild(shareholderSection);
                }
            }
        }

        // Calculate shareholder profit
        function calculateShareholderProfit(shareholder) {
            const totalProfit = parseFloat(localStorage.getItem('madas_total_profit')) || 0;
            const profitShare = (totalProfit * shareholder.percentage) / 100;
            return profitShare;
        }

        // Dark mode toggle functionality
        const darkToggle = document.getElementById('darkToggle');
        const darkIcon = document.getElementById('darkToggleIcon');

        function setDarkMode(on) {
            document.body.classList.toggle('dark-mode', on);
            localStorage.setItem('dark-mode', on ? '1' : '0');
            if (on) {
                darkIcon.innerHTML = '<path d="M21.64 13.64A9 9 0 1 1 10.36 2.36a7 7 0 1 0 11.28 11.28z"/>';
            } else {
                darkIcon.innerHTML = '<path d="M12 2a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1zm5.657 3.343a1 1 0 0 1 1.414 0l.707.707a1 1 0 1 1-1.414 1.414l-.707-.707a1 1 0 0 1 0-1.414zM21 11a1 1 0 1 1 0 2h-1a1 1 0 1 1 0-2h1zm-2.929 7.071a1 1 0 0 1 0 1.414l-.707.707a1 1 0 1 1-1.414-1.414l.707-.707a1 1 0 0 1 1.414 0zM12 20a1 1 0 0 1-1-1v-1a1 1 0 1 1 2 0v1a1 1 0 0 1-1 1zm-7.071-2.929a1 1 0 0 1-1.414 0l-.707-.707a1 1 0 1 1 1.414-1.414l.707.707a1 1 0 0 1 0 1.414zM4 13a1 1 0 1 1 0-2H3a1 1 0 1 1 0 2h1zm2.343-7.657a1 1 0 0 1 0 1.414l-.707.707A1 1 0 1 1 4.222 6.05l.707-.707a1 1 0 0 1 1.414 0zM12 6a6 6 0 1 1 0 12A6 6 0 0 1 12 6z"/>';
            }
        }

        darkToggle.addEventListener('click', () => {
            setDarkMode(!document.body.classList.contains('dark-mode'));
        });

        if (localStorage.getItem('dark-mode') === '1') {
            setDarkMode(true);
        }
    </script>
</body>

</html>
