<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luxury Discount Wheel - MADAS</title>
    <script src="https://cdn.tailwindcss.com">
        // Inventory Dropdown functionality
        document.addEventListener("DOMContentLoaded", () => {
            const inventoryToggle = document.getElementById("inventory-toggle");
            const inventorySubmenu = document.getElementById("inventory-submenu");
            const inventoryArrow = document.getElementById("inventory-arrow");

            if (inventoryToggle && inventorySubmenu && inventoryArrow) {
                inventoryToggle.addEventListener("click", (e) => {
                    e.preventDefault();
                    const isOpen = !inventorySubmenu.classList.contains("hidden");
                    
                    if (isOpen) {
                        inventorySubmenu.classList.add("hidden");
                        inventoryArrow.style.transform = "rotate(0deg)";
                    } else {
                        inventorySubmenu.classList.remove("hidden");
                        inventoryArrow.style.transform = "rotate(180deg)";
                    }
                });
            }
        });</script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"

    <link rel="icon" type="image/x-icon" href="../assets/images/madas-logo.png">
    <style>
        :root {
            /* Siri Color Palette */
            --primary-bg: #000000;
            --secondary-bg: #1a1a1a;
            --accent-blue: #00d4ff;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --accent-orange: #f97316;
            --accent-cyan: #06b6d4;
            --accent-indigo: #6366f1;
            --text-white: #ffffff;
            --text-gray: #a1a1aa;
            --text-muted: #71717a;

            /* Gradients */
            --gradient-primary: linear-gradient(135deg, #00d4ff 0%, #8b5cf6 50%, #ec4899 100%);
            --gradient-secondary: linear-gradient(135deg, #06b6d4 0%, #6366f1 100%);
            --gradient-dark: linear-gradient(135deg, #000000 0%, #1a1a1a 50%, #000000 100%);
            --gradient-glass: linear-gradient(135deg, rgba(0, 212, 255, 0.1) 0%, rgba(139, 92, 246, 0.05) 100%);

            /* Shadows */
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 40px rgba(0, 212, 255, 0.5);
            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.3);

            /* Border Radius */
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;

            /* Spacing */
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;

            /* Typography */
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-display: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

            /* Legacy variables for compatibility */
            --bg-main: #000000;
            --bg-gradient: linear-gradient(135deg, #000000 0%, #1a1a1a 50%, #000000 100%);
            --glass-bg: rgba(26, 26, 26, 0.9);
            --text-main: #ffffff;
            --text-secondary: #a1a1aa;
            --brand-gold: #00d4ff;
            --brand-gold-dark: #8b5cf6;
            --brand-accent: #ec4899;
            --card-bg: rgba(0, 212, 255, 0.1);
            --card-border: rgba(0, 212, 255, 0.3);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --neon-glow: 0 0 40px rgba(0, 212, 255, 0.5);
            --glass-effect: rgba(0, 212, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            width: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: var(--font-primary);
            background: var(--primary-bg);
            color: var(--text-white);
        }

        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 80%, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(236, 72, 153, 0.06) 0%, transparent 50%);
            animation: backgroundFloat 20s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes backgroundFloat {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(-10px, -10px) scale(1.05);
            }

            66% {
                transform: translate(10px, 10px) scale(0.95);
            }
        }

        /* Siri Background Effects */
        body::after {
            /* Keep the subtle star/particle effect if desired, or comment out for pure Siri look */
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: none;
            z-index: 0;
            pointer-events: none;
        }

        /* Floating Background Elements */
        .floating-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -3;
            pointer-events: none;
            overflow: hidden;
        }

        .floating-element {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.15;
            animation: float 15s ease-in-out infinite;
        }

        .floating-element:nth-child(1) {
            background: radial-gradient(circle, #00d4ff 0%, #1a1a1a 80%);
            width: 600px;
            height: 400px;
            top: 10%;
            left: 5%;
            animation-delay: 0s;
        }

        .floating-element:nth-child(2) {
            background: radial-gradient(circle, #8b5cf6 0%, #1a1a1a 80%);
            width: 400px;
            height: 300px;
            bottom: 10%;
            right: 10%;
            animation-delay: -5s;
        }

        .floating-element:nth-child(3) {
            background: radial-gradient(circle, #ec4899 0%, #1a1a1a 80%);
            width: 300px;
            height: 200px;
            top: 60%;
            left: 60%;
            animation-delay: -10s;
        }

        .floating-element:nth-child(4) {
            background: radial-gradient(circle, #06b6d4 0%, #1a1a1a 80%);
            width: 180px;
            height: 180px;
            top: 30%;
            right: 30%;
            animation-delay: -7s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px) translateX(0px) rotate(0deg);
            }

            25% {
                transform: translateY(-30px) translateX(20px) rotate(90deg);
            }

            50% {
                transform: translateY(-15px) translateX(-15px) rotate(180deg);
            }

            75% {
                transform: translateY(20px) translateX(10px) rotate(270deg);
            }
        }

        @keyframes backgroundFloat {

            0%,
            100% {
                transform: translateY(0px) rotate(0deg);
            }

            33% {
                transform: translateY(-20px) rotate(1deg);
            }

            66% {
                transform: translateY(10px) rotate(-1deg);
            }
        }

        body {
            background: #000000;
            color: var(--text-main);
            transition: background 0.5s, color 0.5s;
            font-family: var(--font-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .wheel-section,
        .main-container,
        .prizes-section,
        .prize-card {
            transition: background 0.5s, color 0.5s, border-color 0.5s;
        }

        .prize-card {
            background: var(--card-bg);
            border-color: var(--card-border);
        }

        /* Dark mode styles - now using modern palette */
        body.dark-mode {
            --bg-main: #000000;
            --bg-gradient: linear-gradient(135deg, #000000 0%, #000000 50%, #000000 100%);
            --glass-bg: rgba(0, 0, 0, 0.9);
            --text-main: #ffffff;
            --text-secondary: #888888;
            --brand-gold: #00d4ff;
            --brand-gold-dark: #8b5cf6;
            --brand-accent: #ec4899;
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.05);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --neon-glow: 0 0 20px rgba(0, 212, 255, 0.3);
            --glass-effect: rgba(255, 255, 255, 0.03);
        }

        /* Back button */
        .back-button {
            position: fixed;
            top: var(--spacing-md);
            left: var(--spacing-md);
            z-index: 1000;
            background: var(--gradient-primary);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-md);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-soft);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            color: var(--text-white);
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
        }

        .back-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), transparent);
            border-radius: var(--radius-md);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .back-button:hover {
            background: var(--gradient-secondary);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px) scale(1.02);
            box-shadow: var(--shadow-glow);
        }

        .back-button:hover::before {
            opacity: 1;
        }

        .back-button:active {
            transform: translateY(0) scale(0.98);
        }

        .back-button svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Modern Button Styles with Siri Animations */
        .spin-button {
            background: linear-gradient(135deg, #06b6d4 0%, #6366f1 50%, #f97316 100%);
            color: var(--text-white);
            border: 2px solid rgba(6, 182, 212, 0.4);
            padding: var(--spacing-md) var(--spacing-xl);
            border-radius: var(--radius-lg);
            font-size: 1.3rem;
            font-weight: 700;
            font-family: var(--font-display);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 20px rgba(6, 182, 212, 0.4);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            margin-top: var(--spacing-lg);
            animation: buttonGlow 2s ease-in-out infinite alternate;
        }

        .spin-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .spin-button::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(145deg, rgba(0, 212, 255, 0.1), transparent);
            border-radius: var(--radius-lg);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .spin-button:hover {
            background: linear-gradient(135deg, #0891b2 0%, #7c3aed 50%, #ea580c 100%);
            border-color: rgba(6, 182, 212, 0.7);
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(6, 182, 212, 0.6);
            animation: buttonPulse 0.6s ease-in-out;
        }

        .spin-button:hover::before {
            left: 100%;
        }

        .spin-button:hover::after {
            opacity: 1;
        }

        .spin-button:active {
            transform: translateY(-2px) scale(0.98);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4), 0 0 15px rgba(0, 212, 255, 0.4);
        }

        .spin-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            animation: none;
        }

        @keyframes buttonGlow {
            0% {
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 212, 255, 0.3);
            }

            100% {
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 212, 255, 0.5);
            }
        }

        @keyframes buttonPulse {
            0% {
                transform: translateY(-4px) scale(1.05);
            }

            50% {
                transform: translateY(-6px) scale(1.08);
            }

            100% {
                transform: translateY(-4px) scale(1.05);
            }
        }

        @keyframes wheelGlow {
            0% {
                box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.32),
                    0 1.5px 0 0 #23283a inset,
                    0 0 50px rgba(255, 215, 0, 0.1);
            }

            100% {
                box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.32),
                    0 1.5px 0 0 #23283a inset,
                    0 0 80px rgba(255, 215, 0, 0.3),
                    0 0 120px rgba(255, 215, 0, 0.1);
            }
        }

        @keyframes centerGlow {
            0% {
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3),
                    inset 0 0 10px rgba(255, 215, 0, 0.2);
            }

            100% {
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3),
                    inset 0 0 20px rgba(255, 215, 0, 0.4),
                    0 0 30px rgba(255, 215, 0, 0.3);
            }
        }

        @keyframes arrowGlow {
            0% {
                filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.7));
            }

            100% {
                filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.9));
            }
        }

        /* Animate all backgrounds and text */
        .main-container,
        .header-section,
        .wheel-section,
        .prizes-section,
        .prize-card {
            transition: background 0.5s, color 0.5s, border-color 0.5s;
        }

        /* Override specific backgrounds */
        .wheel-section {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
        }

        .prizes-section {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            margin-top: var(--spacing-lg);
        }

        .prize-card {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            transition: all 0.3s ease;
        }

        .prize-card:hover {
            background: rgba(0, 0, 0, 0.8);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: var(--shadow-soft);
        }

        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Animated background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, #FFD700 0%, transparent 70%);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px) rotate(0deg);
                opacity: 0.3;
            }

            50% {
                transform: translateY(-20px) rotate(180deg);
                opacity: 1;
            }
        }

        /* Main container */
        .main-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: #000000;
        }

        /* Header section */
        .header-section {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 1s ease-out;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: var(--neon-glow);
            margin-right: 1rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                box-shadow: var(--neon-glow);
            }

            50% {
                transform: scale(1.05);
                box-shadow: 0 0 40px rgba(255, 215, 0, 0.8);
            }
        }

        .brand-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #06b6d4 0%, #6366f1 50%, #f97316 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            animation: textGlow 2s ease-in-out infinite alternate;
        }

        .page-title {
            font-family: var(--font-display);
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--text-white);
            margin: 1rem 0;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            letter-spacing: 3px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textGlow 2s ease-in-out infinite alternate;
        }

        @keyframes textGlow {
            from {
                filter: drop-shadow(0 0 5px rgba(0, 212, 255, 0.5));
            }

            to {
                filter: drop-shadow(0 0 15px rgba(0, 212, 255, 0.8));
            }
        }

        @keyframes glow {
            from {
                text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            }

            to {
                text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), 0 0 30px rgba(255, 215, 0, 0.5);
            }
        }

        .subtitle {
            font-size: 1.3rem;
            color: var(--text-gray);
            margin-bottom: 1rem;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .description {
            font-size: 1.1rem;
            color: var(--text-muted);
            max-width: 600px;
            line-height: 1.6;
            margin: 0 auto;
        }

        /* Wheel section */
        .wheel-section {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-xl);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-soft);
            animation: fadeInUp 1s ease-out 0.3s both;
            position: relative;
            overflow: hidden;
        }

        /* Force dark mode for wheel canvas */
        .wheel-section #wheel-canvas {
            border: 8px solid #2D3748 !important;
            background: repeating-linear-gradient(0deg, #232946, #232946 28px, #23283a 29px, #232946 30px) !important;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.32), 0 1.5px 0 0 #23283a inset, 0 0 50px rgba(255, 215, 0, 0.1) !important;
            animation: wheelGlow 3s ease-in-out infinite alternate !important;
        }

        .wheel-section .wheel-center {
            background: repeating-linear-gradient(0deg, #232946, #232946 8px, #23283a 9px, #232946 10px) !important;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3), inset 0 0 10px rgba(255, 215, 0, 0.2) !important;
        }

        .wheel-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--gradient-glass);
            border-radius: var(--radius-xl);
            opacity: 0.3;
            z-index: -1;
        }

        .wheel-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3), var(--neon-glow);
        }

        .wheel-section:before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 18px;
            background: url('data:image/svg+xml;utf8,<svg width="100%" height="18" xmlns="http://www.w3.org/2000/svg"><path d="M0,9 Q10,18 20,9 T40,9 T60,9 T80,9 T100,9 T120,9 T140,9 T160,9 T180,9 T200,9 T220,9 T240,9 T260,9 T280,9 T300,9 T320,9 T340,9 T360,9 T380,9 T400,9" fill="none" stroke="%23e0e0e0" stroke-width="2"/></svg>') repeat-x;
            z-index: 2;
        }

        .wheel-section:after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 18px;
            background: url('data:image/svg+xml;utf8,<svg width="100%" height="18" xmlns="http://www.w3.org/2000/svg"><path d="M0,9 Q10,0 20,9 T40,9 T60,9 T80,9 T100,9 T120,9 T140,9 T160,9 T180,9 T200,9 T220,9 T240,9 T260,9 T280,9 T300,9 T320,9 T340,9 T360,9 T380,9 T400,9" fill="none" stroke="%23e0e0e0" stroke-width="2"/></svg>') repeat-x;
            z-index: 2;
        }

        .wheel-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        #wheel-canvas {
            width: 520px;
            height: 520px;
            border-radius: 50%;
            border: 8px solid #e0e0e0;
            box-shadow:
                0 8px 32px 0 rgba(60, 60, 60, 0.18),
                0 1.5px 0 0 #e0e0e0 inset,
                0 0 50px rgba(255, 215, 0, 0.2);
            background: repeating-linear-gradient(0deg, #fff, #fff 28px, #f7f7f7 29px, #fff 30px);
            position: relative;
            transition: transform 0.3s ease;
        }

        #wheel-canvas:before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 18px;
            background: url('data:image/svg+xml;utf8,<svg width="100%" height="18" xmlns="http://www.w3.org/2000/svg"><path d="M0,9 Q10,18 20,9 T40,9 T60,9 T80,9 T100,9 T120,9 T140,9 T160,9 T180,9 T200,9 T220,9 T240,9 T260,9 T280,9 T300,9 T320,9 T340,9 T360,9 T380,9 T400,9" fill="none" stroke="%23e0e0e0" stroke-width="2"/></svg>') repeat-x;
            z-index: 2;
            border-radius: 50%;
        }

        #wheel-canvas:after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 18px;
            background: url('data:image/svg+xml;utf8,<svg width="100%" height="18" xmlns="http://www.w3.org/2000/svg"><path d="M0,9 Q10,0 20,9 T40,9 T60,9 T80,9 T100,9 T120,9 T140,9 T160,9 T180,9 T200,9 T220,9 T240,9 T260,9 T280,9 T300,9 T320,9 T340,9 T360,9 T380,9 T400,9" fill="none" stroke="%23e0e0e0" stroke-width="2"/></svg>') repeat-x;
            z-index: 2;
            border-radius: 50%;
        }

        #wheel-canvas:hover {
            transform: scale(1.02);
        }

        .wheel-center {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid #FFD700;
            background: #fffbe6;
            box-shadow:
                0 4px 16px rgba(0, 0, 0, 0.1),
                inset 0 0 10px rgba(255, 255, 255, 0.3);
            transition: all 0.5s ease;
        }

        /* Glossy overlay */
        .gloss {
            pointer-events: none;
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(120deg, rgba(255, 215, 0, 0.2) 0%, rgba(255, 215, 0, 0.05) 60%, rgba(255, 215, 0, 0.0) 100%);
            z-index: 2;
        }

        /* Sparkle effects */
        .sparkle {
            position: absolute;
            pointer-events: none;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
            z-index: 3;
        }

        /* Wheel Arrow Pointer */
        .wheel-arrow {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #FFD700;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.7));
            animation: arrowGlow 2s ease-in-out infinite alternate;
            z-index: 15;
        }

        .wheel-arrow::after {
            content: '';
            position: absolute;
            top: -35px;
            left: -15px;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #fff;
        }

        .sparkle span {
            position: absolute;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, #fff 0%, #FFD700 80%, transparent 100%);
            border-radius: 50%;
            opacity: 0.8;
            animation: sparkle 3s infinite linear;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        @keyframes sparkle {
            0% {
                opacity: 0.3;
                transform: scale(0.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }

            100% {
                opacity: 0.3;
                transform: scale(0.8);
            }
        }

        /* Spin button */
        .spin-button {
            background: linear-gradient(135deg, #06b6d4 0%, #6366f1 50%, #f97316 100%);
            color: var(--text-white);
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1.5rem;
            border: 2px solid rgba(6, 182, 212, 0.4);
            border-radius: 2rem;
            padding: 1.5rem 4rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 20px rgba(6, 182, 212, 0.4);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            animation: buttonGlow 2s ease-in-out infinite alternate;
        }

        @keyframes buttonGlow {
            0% {
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 20px rgba(6, 182, 212, 0.4);
            }

            100% {
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 30px rgba(6, 182, 212, 0.6);
            }
        }

        .spin-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .spin-button:hover::before {
            left: 100%;
        }

        .spin-button:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.6),
                0 0 30px rgba(6, 182, 212, 0.6);
            background: linear-gradient(135deg, #0891b2 0%, #7c3aed 50%, #ea580c 100%);
        }

        .spin-button:active {
            transform: translateY(0);
        }

        .spin-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Result message */
        .result-container {
            margin-top: 2rem;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        .result-message {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: #FFD700;
            font-weight: 700;
            margin-bottom: 1rem;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
        }

        .discount-code {
            font-family: 'Inter', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            color: #ffffff;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 1rem 0;
            letter-spacing: 3px;
        }

        .discount-description {
            font-size: 1.2rem;
            color: #e0e0e0;
            margin-bottom: 0.5rem;
        }

        .validity-text {
            font-size: 0.9rem;
            color: #ff6b6b;
            margin-top: 0.5rem;
        }

        .usage-text {
            font-size: 0.8rem;
            color: #b0b0b0;
            margin-top: 0.25rem;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .page-title {
                font-size: 2.5rem;
            }

            #wheel-canvas {
                width: 400px;
                height: 400px;
            }

            .wheel-section {
                padding: 2rem;
            }

            .spin-button {
                padding: 1.2rem 3rem;
                font-size: 1.3rem;
            }

                font-size: 2rem;

            margin-bottom: 2rem;
            font-weight: 700;

            }

            border-color: var(--card-border) !important;

        input[type="text"]:focus,
        input[type="number"]:focus,

            background-color: var(--card-bg) !important;

        }

        select:focus {

            background: url('data:image/svg+xml;utf8,<svg width="100%" height="18" xmlns="http://www.w3.org/2000/svg"><path d="M0,9 Q10,0 20,9 T40,9 T60,9 T80,9 T100,9 T120,9 T140,9 T160,9 T180,9 T200,9 T220,9 T240,9 T260,9 T280,9 T300,9 T320,9 T340,9 T360,9 T380,9 T400,9" fill="none" stroke="%23e0e0e0" stroke-width="2"/></svg>') repeat-x;

<body>
    <!-- Floating Background Elements -->
    <div class="floating-bg">
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
    </div>

    <!-- Back button -->
    <a href="game-hub.html" class="back-button" title="Back to Madas Hub">
        <svg viewBox="0 0 24 24">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
        </svg>
        BACK
    </a>
    <!-- Animated background particles -->
    <div class="particles" id="particles"></div>

    <div class="main-container">
        <canvas id="galaxyBg" class="galaxy-bg"></canvas>
        <div class="paper-dashboard">
            <!-- Header Section -->
            <div class="header-section">
                <div class="logo-container">
                    <div class="logo">🎯</div>
                    <h1 class="brand-title">MADAS</h1>
                </div>
                <h2 class="page-title">Luxury Discount Wheel</h2>
                <p class="subtitle">Experience the thrill of exclusive savings</p>
                <p class="description">
                    Spin our magnificent wheel and discover your personalized discount.
                    Every spin is a chance to unlock extraordinary savings on our premium collection.
                </p>
            </div>

            <!-- Wheel Section -->
            <div class="wheel-section">
                <div class="wheel-container">
                    <div class="relative" style="width: 520px; height: 520px;">
                        <canvas id="wheel-canvas" width="520" height="520"></canvas>
                        <div class="gloss"></div>
                        <div class="wheel-center" id="wheelCenter"></div>
                        <div class="sparkle" id="sparkle"></div>
                        <div class="wheel-arrow" id="wheelArrow"></div>
                    </div>
                    <button id="spinBtn" class="spin-button">🎯 SPIN TO WIN</button>
                    <div id="resultMsg" class="result-container"></div>
                </div>
            </div>

            <!-- Prizes Section -->
            <div class="prizes-section">
                <h3 class="prizes-title">Available Prizes</h3>
                <div class="prizes-grid" id="prizesGrid">
                    <!-- Prizes will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </div>
    <!-- Sound effects -->
    <audio id="spinSound" src="../assets/Sounds/spin-232536.mp3" preload="auto"></audio>
    <audio id="tickSound" src="https://cdn.pixabay.com/audio/2022/10/16/audio_124bfae3e2.mp3" preload="auto"></audio>
    <audio id="winSound" src="https://cdn.pixabay.com/audio/2022/07/26/audio_124bfae3e2.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // Your Firebase config (replace with your actual config)
        const firebaseConfig = {
            apiKey: "AIzaSyC-ls1TrvSkrw71KqmB_kHYgPoj0H550a8",
            authDomain: "madas-store.firebaseapp.com",
            projectId: "madas-store",
            storageBucket: "madas-store.firebasestorage.app",
            messagingSenderId: "527071300010",
            appId: "1:527071300010:web:7470e2204065b4590583d3",
            measurementId: "G-NQVR1F4N3Q"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Show loading spinner/message
        const prizesGrid = document.getElementById('prizesGrid');
        prizesGrid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:2rem; font-size:1.2rem;">Loading prizes...</div>';
        const spinBtn = document.getElementById('spinBtn');
        spinBtn.disabled = true;
        spinBtn.textContent = 'Loading...';

        // Fetch prizes from Firestore
        async function getPrizes() {
            const querySnapshot = await getDocs(collection(db, "discountWheelPrizes"));
            return querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        }

        // Display prizes in the grid
        async function displayPrizes(prizes) {
            prizesGrid.innerHTML = '';
            if (!prizes.length) {
                prizesGrid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:2rem; font-size:1.2rem;">No prizes found.</div>';
                return;
            }
            prizes.forEach(prize => {
                const prizeCard = document.createElement('div');
                prizeCard.className = 'prize-card';
                prizeCard.innerHTML = `
                    <div class="prize-percent">${prize.percent}%</div>
                    <div class="prize-description">${prize.description}</div>
                `;
                prizeCard.style.borderColor = prize.color;
                prizesGrid.appendChild(prizeCard);
            });
        }

        // Draw the wheel with prizes
        function drawWheel(prizes) {
            const canvas = document.getElementById('wheel-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 520, 520);
            const cx = 260, cy = 260;
            const radius = 225;
            const totalWeight = prizes.reduce((sum, prize) => sum + Number(prize.winPercent), 0);
            let currentAngle = 0;
            for (let i = 0; i < prizes.length; i++) {
                const prize = prizes[i];
                const segmentAngle = (2 * Math.PI) * (Number(prize.winPercent) / totalWeight);
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, currentAngle, currentAngle + segmentAngle);
                ctx.closePath();
                ctx.fillStyle = prize.color;
                ctx.shadowColor = '#FFD700';
                ctx.shadowBlur = 16;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.restore();
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, currentAngle, currentAngle + segmentAngle);
                ctx.closePath();
                ctx.strokeStyle = '#FFD700';
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.restore();
                if (segmentAngle > 0.1) {
                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.rotate(currentAngle + segmentAngle / 2);
                    ctx.textAlign = 'right';
                    ctx.font = 'bold 20px Playfair Display, serif';
                    ctx.fillStyle = '#333';
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 3;
                    ctx.strokeText(prize.percent + '%', radius - 40, 8);
                    ctx.fillText(prize.percent + '%', radius - 40, 8);
                    ctx.restore();
                }
                currentAngle += segmentAngle;
            }
            // Set initial center color
            const wheelCenter = document.getElementById('wheelCenter');
            wheelCenter.style.backgroundColor = '#fffbe6';
        }

        // --- SPIN LOGIC ---
        // (Replaces getPrizes() with async fetch)
        let globalPrizes = [];
        let spinning = false;
        let currentUser = { name: 'Test User', phone: '0000000000' };
        const resultMsg = document.getElementById('resultMsg');
        const spinSound = document.getElementById('spinSound');
        const tickSound = document.getElementById('tickSound');
        const winSound = document.getElementById('winSound');

        function generateCode(percent) {
            const words = ['SUMMER', 'WINTER', 'SPRING', 'FALL', 'FLASH', 'SPECIAL', 'BIG', 'HAPPY', 'LUCKY', 'GOLD'];
            const randomWord = words[Math.floor(Math.random() * words.length)];
            return randomWord + percent;
        }

        function setSpun(phone, data) {
            localStorage.setItem('wheel-spin-' + phone, JSON.stringify(data));
        }

        spinBtn.addEventListener('click', async function () {
            if (spinning || !globalPrizes.length) return;
            spinning = true;
            spinBtn.disabled = true;
            spinBtn.textContent = '🎯 SPINNING...';
            spinSound.currentTime = 0;
            spinSound.play();
            const prizes = globalPrizes;
            let totalWeight = prizes.reduce((sum, prize) => sum + Number(prize.winPercent), 0);
            let rand = Math.random() * totalWeight;
            let winnerIdx = 0;
            let acc = 0;
            for (let i = 0; i < prizes.length; i++) {
                acc += Number(prizes[i].winPercent);
                if (rand < acc) {
                    winnerIdx = i;
                    break;
                }
            }
            let angles = [];
            let angleSum = 0;
            for (let i = 0; i < prizes.length; i++) {
                let segAngle = 360 * (Number(prizes[i].winPercent) / totalWeight);
                angles.push({ start: angleSum, end: angleSum + segAngle, mid: angleSum + segAngle / 2 });
                angleSum += segAngle;
            }
            let winnerAngle = angles[winnerIdx].mid;
            let canvas = document.getElementById('wheel-canvas');
            const wheelArrow = document.getElementById('wheelArrow');
            wheelArrow.style.animation = 'arrow-pulse 1s ease-in-out infinite';
            const FPS = 60;
            const TOTAL_FRAMES = 4 * FPS;
            const accelFrames = Math.floor(TOTAL_FRAMES * 0.2);
            const decelFrames = Math.floor(TOTAL_FRAMES * 0.2);
            const constantFrames = TOTAL_FRAMES - accelFrames - decelFrames;
            const totalRotation = 360 * 8;
            const targetFinal = totalRotation + (270 - winnerAngle);
            const v = targetFinal / (constantFrames + 0.5 * (accelFrames + decelFrames));
            const a = v / accelFrames;
            let currentAngle = 0;
            let angularVelocity = 0;
            let frame = 0;
            let tickInterval = 360 / prizes.length;
            let nextTick = tickInterval;
            function animate() {
                frame++;
                if (frame <= accelFrames) {
                    angularVelocity += a;
                } else if (frame <= accelFrames + constantFrames) {
                    angularVelocity = v;
                } else if (frame <= TOTAL_FRAMES) {
                    angularVelocity -= a;
                } else {
                    currentAngle = targetFinal;
                    canvas.style.transform = `rotate(${targetFinal}deg)`;
                    spinSound.pause();
                    spinSound.currentTime = 0;
                    winSound.currentTime = 0;
                    winSound.play();
                    let winner = prizes[winnerIdx];
                    const code = winner.percent > 0 ? generateCode(winner.percent) : winner.code;
                    const wheelCenter = document.getElementById('wheelCenter');
                    wheelCenter.style.backgroundColor = winner.color;
                    wheelCenter.style.background = winner.color;
                    const spinData = {
                        name: currentUser.name,
                        phone: currentUser.phone,
                        code: code,
                        percent: winner.percent,
                        description: winner.description,
                        date: new Date().toISOString()
                    };
                    setSpun(currentUser.phone, spinData);
                    resultMsg.innerHTML = `
                        <div class="result-message">🎉 Congratulations!</div>
                        <div class="discount-code">${code}</div>
                        <div class="discount-description">${winner.description}</div>
                        <div class="validity-text">⏰ Valid for 7 days only</div>
                        <div class="usage-text">💳 Use this code at checkout</div>
                    `;
                    spinBtn.disabled = false;
                    spinBtn.textContent = '🎯 SPIN TO WIN';
                    spinning = false;
                    return;
                }
                currentAngle += angularVelocity;
                canvas.style.transform = `rotate(${currentAngle}deg)`;
                if (currentAngle >= nextTick) {
                    tickSound.currentTime = 0;
                    tickSound.play();
                    nextTick += tickInterval;
                }
                requestAnimationFrame(animate);
            }
            animate();
        });

        // Sparkle effect JS
        function createSparkles() {
            const sparkle = document.getElementById('sparkle');
            sparkle.innerHTML = '';
            for (let i = 0; i < 20; i++) {
                const span = document.createElement('span');
                const angle = Math.random() * 2 * Math.PI;
                const radius = 200 + Math.random() * 80;
                span.style.left = (260 + Math.cos(angle) * radius) + 'px';
                span.style.top = (260 + Math.sin(angle) * radius) + 'px';
                span.style.animationDelay = (Math.random() * 3) + 's';
                span.style.animationDuration = (2 + Math.random() * 2) + 's';
                sparkle.appendChild(span);
            }
        }

        // On DOMContentLoaded, fetch prizes and initialize
        document.addEventListener('DOMContentLoaded', async function () {
            // (Particles, sparkles, dark mode, etc. remain outside this module script)
            const prizes = await getPrizes();
            globalPrizes = prizes;
            await displayPrizes(prizes);
            drawWheel(prizes);
            createSparkles();
            spinBtn.disabled = !prizes.length;
            spinBtn.textContent = prizes.length ? '🎯 SPIN TO WIN' : 'No Prizes';
        });

        // Also re-create sparkles after dark mode toggle
        if (typeof darkToggle !== 'undefined') {
            darkToggle.addEventListener('click', () => {
                setTimeout(createSparkles, 100); // slight delay to allow mode switch
            });
        }
    </script>
    <script>
        // Dark mode toggle logic
        const darkToggle = document.getElementById('darkToggle');
        const darkIcon = document.getElementById('darkToggleIcon');
        function setDarkMode(on) {
            document.body.classList.toggle('dark-mode', on);
            localStorage.setItem('dark-mode', on ? '1' : '0');
            // Animate icon (optional: swap sun/moon)
            if (on) {
                darkIcon.innerHTML = '<path d="M21.64 13.64A9 9 0 1 1 10.36 2.36a7 7 0 1 0 11.28 11.28z"/>';
            } else {
                darkIcon.innerHTML = '<path d="M12 2a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1zm5.657 3.343a1 1 0 0 1 1.414 0l.707.707a1 1 0 1 1-1.414 1.414l-.707-.707a1 1 0 0 1 0-1.414zM21 11a1 1 0 1 1 0 2h-1a1 1 0 1 1 0-2h1zm-2.929 7.071a1 1 0 0 1 0 1.414l-.707.707a1 1 0 1 1-1.414-1.414l.707-.707a1 1 0 0 1 1.414 0zM12 20a1 1 0 0 1-1-1v-1a1 1 0 1 1 2 0v1a1 1 0 0 1-1 1zm-7.071-2.929a1 1 0 0 1-1.414 0l-.707-.707a1 1 0 1 1 1.414-1.414l.707.707a1 1 0 0 1 0 1.414zM4 13a1 1 0 1 1 0-2H3a1 1 0 1 1 0 2h1zm2.343-7.657a1 1 0 0 1 0 1.414l-.707.707A1 1 0 1 1 4.222 6.05l.707-.707a1 1 0 0 1 1.414 0zM12 6a6 6 0 1 1 0 12A6 6 0 0 1 12 6z"/>';
            }
        }
        darkToggle.addEventListener('click', () => {
            setDarkMode(!document.body.classList.contains('dark-mode'));
        });
        // On load, set mode from localStorage
        if (localStorage.getItem('dark-mode') === '1') {
            setDarkMode(true);
        }
    </script>
    <script>
        // Galaxy/starfield effect
        function initGalaxy() {
            const canvas = document.getElementById('galaxyBg');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            function resize() {
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
            }
            resize();
            window.addEventListener('resize', resize);
            const numStars = 120;
            let stars = [];
            function randomStar() {
                return {
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 1.2 + 0.3,
                    alpha: Math.random() * 0.7 + 0.3,
                    speed: Math.random() * 0.15 + 0.02,
                    twinkle: Math.random() * 0.05 + 0.01
                };
            }
            function createStars() {
                stars = [];
                for (let i = 0; i < numStars; i++) {
                    stars.push(randomStar());
                }
            }
            createStars();
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let isDark = document.body.classList.contains('dark-mode');
                for (let star of stars) {
                    ctx.save();
                    ctx.globalAlpha = star.alpha;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.r, 0, 2 * Math.PI);
                    ctx.fillStyle = isDark ? '#fff' : '#bfa100';
                    ctx.shadowColor = isDark ? '#fff' : '#FFD700';
                    ctx.shadowBlur = isDark ? 8 : 4;
                    ctx.fill();
                    ctx.restore();
                    // Twinkle
                    star.alpha += (Math.random() - 0.5) * star.twinkle;
                    if (star.alpha < 0.2) star.alpha = 0.2;
                    if (star.alpha > 1) star.alpha = 1;
                    // Move star slowly downward for parallax
                    star.y += star.speed;
                    if (star.y > canvas.height) {
                        star.x = Math.random() * canvas.width;
                        star.y = 0;
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
            // Recreate stars on resize
            window.addEventListener('resize', () => {
                resize();
                createStars();
            });
            // Recolor on dark mode toggle
            if (typeof darkToggle !== 'undefined') {
                darkToggle.addEventListener('click', () => {
                    setTimeout(() => createStars(), 200);
                });
            }
        }
        document.addEventListener('DOMContentLoaded', initGalaxy);
    </script>
