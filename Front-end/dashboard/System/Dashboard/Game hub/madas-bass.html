<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MADAS Bass Progress</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #181825;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.5s, color 0.5s;
            overflow: hidden;
        }

        .galaxy-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .nebula {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.5;
            pointer-events: none;
        }

        .nebula1 {
            background: radial-gradient(circle, #7f5af0 0%, #232946 80%);
            width: 600px;
            height: 400px;
            top: 10%;
            left: 5%;
        }

        .nebula2 {
            background: radial-gradient(circle, #ff6b6b 0%, #232946 80%);
            width: 400px;
            height: 300px;
            bottom: 10%;
            right: 10%;
        }

        .nebula3 {
            background: radial-gradient(circle, #FFD700 0%, #232946 80%);
            width: 300px;
            height: 200px;
            top: 60%;
            left: 60%;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            pointer-events: none;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            from {
                opacity: 0.6;
            }

            to {
                opacity: 1;
            }
        }

        .center-container {
            background: rgba(35, 41, 70, 0.92);
            border-radius: 18px;
            box-shadow: 0 8px 32px 0 rgba(60, 60, 60, 0.28), 0 0 40px 0 #7f5af088;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .fun-progress {
            margin: 2.5rem 0 1.2rem 0;
            width: 100%;
            height: 90px;
            background: rgba(127, 90, 240, 0.13);
            border-radius: 40px;
            box-shadow: 0 2px 16px #FFD70022;
            overflow: hidden;
            position: relative;
            border: 2px solid #FFD70088;
        }

        .fluid-wave {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 60px;
            pointer-events: none;
            z-index: 2;
        }

        .fun-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #FFD700 0%, #7f5af0 100%);
            border-radius: 40px 0 0 40px;
            box-shadow: 0 0 32px #FFD70088, 0 0 0 #7f5af000;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            font-size: 2.5rem;
            font-weight: bold;
            color: #232946;
            transition: width 0.7s cubic-bezier(.68, -0.55, .27, 1.55);
            position: relative;
            overflow: visible;
        }

        .fun-progress-face {
            position: absolute;
            right: 1.5rem;
            bottom: 1.2rem;
            transform: scale(1.3);
            font-size: 2.5rem;
            filter: drop-shadow(0 0 12px #FFD700cc);
            transition: transform 0.2s;
            z-index: 3;
        }

        .fun-progress-bar.bounce {
            animation: bounceBar 0.5s;
        }

        @keyframes bounceBar {
            0% {
                transform: scaleY(1);
            }

            30% {
                transform: scaleY(1.18);
            }

            60% {
                transform: scaleY(0.92);
            }

            100% {
                transform: scaleY(1);
            }
        }

        .fun-progress-label {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            color: #FFD700;
            font-weight: 700;
            letter-spacing: 0.5px;
            pointer-events: none;
            text-shadow: 0 2px 8px #23294644;
        }

        body.dark-mode .center-container {
            background: rgba(255, 251, 230, 0.92);
            color: #232946;
            box-shadow: 0 8px 32px 0 #FFD70044, 0 0 40px 0 #FFD70044;
        }

        body.dark-mode .fun-progress {
            background: rgba(255, 251, 230, 0.92);
            border-color: #FFD700;
        }

        body.dark-mode .fun-progress-bar {
            background: linear-gradient(90deg, #232946 0%, #7f5af0 100%);
            color: #FFD700;
        }

        body.dark-mode .fun-progress-label {
            color: #7f5af0;
        }
    </style>

    <!-- Business Isolation Scripts -->
    <script src="../js/business-isolation.js"></script>
    <script src="../js/page-template.js"></script>
</head>

<body>
    <div class="galaxy-bg" id="galaxyBg">
        <div class="nebula nebula1"></div>
        <div class="nebula nebula2"></div>
        <div class="nebula nebula3"></div>
        <!-- Stars will be added by JS -->
    </div>
    <button class="dark-toggle" id="darkToggle" title="Toggle dark mode">
        <svg id="darkToggleIcon" viewBox="0 0 24 24">
            <path
                d="M12 2a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1zm5.657 3.343a1 1 0 0 1 1.414 0l.707.707a1 1 0 1 1-1.414 1.414l-.707-.707a1 1 0 0 1 0-1.414zM21 11a1 1 0 1 1 0 2h-1a1 1 0 1 1 0-2h1zm-2.929 7.071a1 1 0 0 1 0 1.414l-.707.707a1 1 0 1 1-1.414-1.414l.707-.707a1 1 0 0 1 1.414 0zM12 20a1 1 0 0 1-1-1v-1a1 1 0 1 1 2 0v1a1 1 0 0 1-1 1zm-7.071-2.929a1 1 0 0 1-1.414 0l-.707-.707a1 1 0 1 1 1.414-1.414l.707.707a1 1 0 0 1 0 1.414zM4 13a1 1 0 1 1 0-2H3a1 1 0 1 1 0 2h1zm2.343-7.657a1 1 0 0 1 0 1.414l-.707.707A1 1 0 1 1 4.222 6.05l.707-.707a1 1 0 0 1 1.414 0zM12 6a6 6 0 1 1 0 12A6 6 0 0 1 12 6z" />
        </svg>
    </button>
    <div class="center-container">
        <h1 style="margin-bottom:1.2rem;">MADAS Bass Progress</h1>
        <div class="fun-progress">
            <div class="fun-progress-bar" id="funProgressBar">
                <svg class="fluid-wave" id="fluidWave" viewBox="0 0 500 60" preserveAspectRatio="none">
                    <path id="fluidWavePath" d="" fill="#FFD700" fill-opacity="0.7" />
                </svg>
                <span class="fun-progress-face" id="funProgressFace">😎</span>
            </div>
            <span class="fun-progress-label" id="funProgressLabel">0%</span>
        </div>
    </div>
    <script>
        // Dark mode logic
        const darkToggle = document.getElementById('darkToggle');
        const darkIcon = document.getElementById('darkToggleIcon');
        function setDarkMode(on) {
            document.body.classList.toggle('dark-mode', on);
            localStorage.setItem('dark-mode', on ? '1' : '0');
            if (on) {
                darkIcon.innerHTML = '<path d="M21.64 13.64A9 9 0 1 1 10.36 2.36a7 7 0 1 0 11.28 11.28z"/>';
            } else {
                darkIcon.innerHTML = '<path d="M12 2a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1zm5.657 3.343a1 1 0 0 1 1.414 0l.707.707a1 1 0 1 1-1.414 1.414l-.707-.707a1 1 0 0 1 0-1.414zM21 11a1 1 0 1 1 0 2h-1a1 1 0 1 1 0-2h1zm-2.929 7.071a1 1 0 0 1 0 1.414l-.707.707a1 1 0 1 1-1.414-1.414l.707-.707a1 1 0 0 1 1.414 0zM12 20a1 1 0 0 1-1-1v-1a1 1 0 1 1 2 0v1a1 1 0 0 1-1 1zm-7.071-2.929a1 1 0 0 1-1.414 0l-.707-.707a1 1 0 1 1 1.414-1.414l.707.707a1 1 0 0 1 0 1.414zM4 13a1 1 0 1 1 0-2H3a1 1 0 1 1 0 2h1zm2.343-7.657a1 1 0 0 1 0 1.414l-.707.707A1 1 0 1 1 4.222 6.05l.707-.707a1 1 0 0 1 1.414 0zM12 6a6 6 0 1 1 0 12A6 6 0 0 1 12 6z" />';
            }
        }
        darkToggle.addEventListener('click', () => {
            setDarkMode(!document.body.classList.contains('dark-mode'));
        });
        if (localStorage.getItem('dark-mode') === '1') {
            setDarkMode(true);
        }
        // Galaxy stars
        function createStars(num) {
            const galaxy = document.getElementById('galaxyBg');
            for (let i = 0; i < num; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.opacity = 0.5 + Math.random() * 0.5;
                star.style.animationDuration = `${1.5 + Math.random() * 2}s`;
                galaxy.appendChild(star);
            }
        }
        createStars(120);
        // Fun animated progress bar logic
        const bar = document.getElementById('funProgressBar');
        const label = document.getElementById('funProgressLabel');
        const face = document.getElementById('funProgressFace');
        const wave = document.getElementById('fluidWave');
        const wavePath = document.getElementById('fluidWavePath');
        const faces = ['😎', '🤩', '😆', '🥳', '😺', '🦄', '👾', '🐟', '🎵', '💃'];
        let progress = 0;
        let direction = 1;
        function animateBar() {
            progress += direction * 2 + Math.random() * 2;
            if (progress >= 100) {
                progress = 100;
                direction = -1;
                bar.classList.add('bounce');
                face.textContent = faces[Math.floor(Math.random() * faces.length)];
            } else if (progress <= 0) {
                progress = 0;
                direction = 1;
                bar.classList.add('bounce');
                face.textContent = faces[Math.floor(Math.random() * faces.length)];
            }
            bar.style.width = progress + '%';
            label.textContent = Math.round(progress) + '%';
            setTimeout(() => bar.classList.remove('bounce'), 300);
            // Animate the fluid wave
            const w = 500, h = 60;
            const fill = w * (progress / 100);
            const waveHeight = 12 + 8 * Math.sin(Date.now() / 400);
            let path = `M0,${h} L0,${h / 2}`;
            for (let x = 0; x <= fill; x += 20) {
                const y = h / 2 + Math.sin((x / 40) + Date.now() / 700) * waveHeight;
                path += ` L${x},${y}`;
            }
            path += ` L${fill},${h} Z`;
            wavePath.setAttribute('d', path);
            requestAnimationFrame(animateBar);
        }
        animateBar();
    
        // Inventory Dropdown functionality
        document.addEventListener("DOMContentLoaded", () => {
            const inventoryToggle = document.getElementById("inventory-toggle");
            const inventorySubmenu = document.getElementById("inventory-submenu");
            const inventoryArrow = document.getElementById("inventory-arrow");

            if (inventoryToggle && inventorySubmenu && inventoryArrow) {
                inventoryToggle.addEventListener("click", (e) => {
                    e.preventDefault();
                    const isOpen = !inventorySubmenu.classList.contains("hidden");
                    
                    if (isOpen) {
                        inventorySubmenu.classList.add("hidden");
                        inventoryArrow.style.transform = "rotate(0deg)";
                    } else {
                        inventorySubmenu.classList.remove("hidden");
                        inventoryArrow.style.transform = "rotate(180deg)";
                    }
                });
            }
        });
    </script>
</body>

</html>
